<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- The share card: rendered to og.png by tools/render-icons.sh. Laid out
       as the other Tactical games' cards are (games-meta STANDARD.md §9): a
       cyan rule, the wordmark with the game's half in cyan, the description,
       a tagline, the icon. Behind the words, the game itself: og-scene.png
       is a frame of the New York scope at Prime Time from the game's own
       renderer (practice, seed 70, 84 ticks in, drawn at 2x; the two amber planes are
       low on fuel, the Learning scope pointing each to its airport), its clock bar
       cropped off. The words sit on a shade that clears before it reaches
       the traffic. -->
  <rect width="1200" height="630" fill="#05070f"/>
  <rect x="-100" y="-120" width="1440" height="914" fill="#06101c"/>
  <image x="-100" y="-120" width="1440" height="914" xlink:href="og-scene.png" href="og-scene.png"/>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05070f" stop-opacity="1"/>
      <stop offset=".48" stop-color="#05070f" stop-opacity=".985"/>
      <stop offset=".6" stop-color="#05070f" stop-opacity=".35"/>
      <stop offset=".72" stop-color="#05070f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070f" stop-opacity=".8"/>
      <stop offset="1" stop-color="#05070f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070f" stop-opacity="0"/>
      <stop offset="1" stop-color="#05070f" stop-opacity=".85"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#shade)"/>
  <rect width="1200" height="190" fill="url(#head)"/>
  <rect y="500" width="1200" height="130" fill="url(#foot)"/>
  <rect width="1200" height="8" fill="#54f2ff"/>
  <text x="105" y="140" font-family="Menlo, ui-monospace, monospace" font-size="80" font-weight="700" fill="#e9e9f2">Puma<tspan fill="#54f2ff">Approach</tspan></text>
  <!-- the icon on its own tile, edged so it holds against the scope -->
  <svg x="1020" y="56" width="100" height="100" viewBox="0 0 64 64">
  <rect x=".5" y=".5" width="63" height="63" rx="12" fill="#05070f" stroke="#2b7f92" stroke-width="1"/>
  <circle cx="32" cy="32" r="24" fill="#0a0e1a" stroke="#2b7f92" stroke-width="2"/>
  <circle cx="32" cy="32" r="13" fill="none" stroke="#1b2540" stroke-width="1.5"/>
  <path d="M32 32 L32 8 A24 24 0 0 1 52.8 20 Z" fill="#54f2ff" opacity=".22"/>
  <path d="M32 32 L52.8 20" stroke="#54f2ff" stroke-width="2" stroke-linecap="round"/>
  <g fill="#54f2ff">
    <path d="M22 26 l9 -5 l-2 7 l5 2 l-9 5 l1 -6 z"/>
    <rect x="21" y="38" width="12" height="2"/>
    <rect x="21" y="42" width="12" height="2"/>
    <rect x="21" y="46" width="12" height="2"/>
  </g>
</svg>
  <text y="240" font-family="Menlo, ui-monospace, monospace" font-size="40" fill="#b4bccb">
    <tspan x="105" dy="0">Can you handle a</tspan>
    <tspan x="105" dy="58">career in Air</tspan>
    <tspan x="105" dy="58">Traffic Control...</tspan>
    <tspan x="105" dy="58">in 1985?</tspan>
  </text>
  <text x="105" y="580" font-family="Menlo, ui-monospace, monospace" font-size="26" fill="#54f2ff">An inspired remake of Kennedy Approach on the Commodore 64</text>
</svg>
