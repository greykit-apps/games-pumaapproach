<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- The share card: rendered to og.png by tools/render-icons.sh. Laid out
       as the other Tactical games' cards are: a cyan rule, the wordmark with
       the game's half in cyan, the description, a tagline, the icon. -->
  <rect width="1200" height="630" fill="#05070f"/>
  <rect width="1200" height="8" fill="#54f2ff"/>
  <text x="105" y="148" font-family="Menlo, ui-monospace, monospace" font-size="84" font-weight="700" fill="#e9e9f2">Puma<tspan fill="#54f2ff">Approach</tspan></text>
  <svg x="1000" y="72" width="100" height="100" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#05070f"/>
  <circle cx="32" cy="32" r="24" fill="#0a0e1a" stroke="#2b7f92" stroke-width="2"/>
  <circle cx="32" cy="32" r="13" fill="none" stroke="#1b2540" stroke-width="1.5"/>
  <path d="M32 32 L32 8 A24 24 0 0 1 52.8 20 Z" fill="#54f2ff" opacity=".22"/>
  <path d="M32 32 L52.8 20" stroke="#54f2ff" stroke-width="2" stroke-linecap="round"/>
  <g fill="#54f2ff">
    <path d="M22 26 l9 -5 l-2 7 l5 2 l-9 5 l1 -6 z"/>
    <rect x="21" y="38" width="12" height="2"/>
    <rect x="21" y="42" width="12" height="2"/>
    <rect x="21" y="46" width="12" height="2"/>
  </g>
</svg>
  <text y="256" font-family="Menlo, ui-monospace, monospace" font-size="38" fill="#9aa1ae">
    <tspan x="105" dy="0">Air traffic control on a 1985 radar</tspan>
    <tspan x="105" dy="54">scope. Vector United, Delta, American,</tspan>
    <tspan x="105" dy="54">Air France and Puma Air through five</tspan>
    <tspan x="105" dy="54">busy sectors, three miles apart, and</tspan>
    <tspan x="105" dy="54">climb the GS ladder.</tspan>
  </text>
  <text x="105" y="588" font-family="Menlo, ui-monospace, monospace" font-size="30" fill="#54f2ff">A remake of Kennedy Approach</text>
</svg>
