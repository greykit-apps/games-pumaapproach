/* The shifts, their length in minutes, and the hour on the clock. */
const SHIFTS = [
  { name: "Trainee",    min: 10, hour: 10 },
  { name: "Graveyard",  min: 10, hour: 4 },
  { name: "Afternoon",  min: 15, hour: 13 },
  { name: "Morning",    min: 15, hour: 8 },
  { name: "Prime Time", min: 15, hour: 17 },
];
const MAX_RANK = 7;                              /* GS-13 */
const gsOf = rank => "GS-" + (rank + 6);
/* Which shift a rank works at a facility, 0-based, or -1 for none: the
 * original's table, shift = rank - ceil(facility / 2) + 1. */
function shiftFor(rank, sector) {
  const s = rank - Math.ceil((sector + 1) / 2);
  return s >= 0 && s < SHIFTS.length ? s : -1;
}

/* mulberry32: a small seeded generator, so a seed and the command log replay
 * a shift exactly. */
function rnd(S) {
  S.rng = (S.rng + 0x6D2B79F5) | 0;
  let t = S.rng;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const ri = (S, n) => Math.floor(rnd(S) * n);
function pick(S, weights) {
  const keys = Object.keys(weights);
  let sum = 0; for (const k of keys) sum += weights[k];
  let r = rnd(S) * sum;
  for (const k of keys) { r -= weights[k]; if (r < 0) return k; }
  return keys[keys.length - 1];
}

/* heading from (x,y) toward (tx,ty), snapped to eight */
function bearing(x, y, tx, ty) {
  const a = Math.atan2(tx - x, -(ty - y));            /* 0 north, clockwise */
  return ((Math.round(a / (Math.PI / 4)) % 8) + 8) % 8;
}
/* the short way round, -3..4: a 180 is +4, so it goes right unless told */
function turnDelta(from, to) { const d = (((to - from) % 8) + 8) % 8; return d > 4 ? d - 8 : d; }
const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
const cheb = (a, b) => Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y));
function vorOf(ap) { return { x: ap.x - DIRS[ap.rwy][0] * VOR_D, y: ap.y - DIRS[ap.rwy][1] * VOR_D }; }
function iafOf(ap) { return { x: ap.x - DIRS[ap.rwy][0] * (VOR_D + IAF_D), y: ap.y - DIRS[ap.rwy][1] * (VOR_D + IAF_D) }; }
function inside(sec, x, y) { return x >= 0 && y >= 0 && x < sec.W && y < sec.H; }

/* The heading to take now to reach the goal dot on the goal heading, turning
 * 45 degrees a dot: a breadth-first search over (x, y, heading), which is how
 * a pilot flying to a fix gets there instead of orbiting it. -1 if there is
 * no way. Keeps out of a restricted zone and off the fixes, which are exits;
 * terrain and weather are the controller's problem. */
function navHeading(sec, p, goal) {
  const W = sec.W, key = (x, y, h) => ((y * W + x) << 3) | h;
  if (!sec._fixSet) sec._fixSet = new Set(sec.fixes.map(f => f.x + "," + f.y));
  const prev = new Int32Array(W * sec.H * 8).fill(-1);
  const start = key(p.x, p.y, p.h);
  prev[start] = start;
  const q = [start];
  for (let qi = 0; qi < q.length; qi++) {
    const s = q[qi], h = s & 7, x = (s >> 3) % W, y = (s >> 3) / W | 0;
    if (typeof goal === "function" ? goal(x, y, h) : x === goal.x && y === goal.y && h === goal.h) {
      let cur = s;
      while (prev[cur] !== start) cur = prev[cur];
      return cur & 7;
    }
    for (const dh of [0, 1, 7]) {
      const nh = (h + dh) & 7, nx = x + DIRS[nh][0], ny = y + DIRS[nh][1];
      if (!inside(sec, nx, ny) || (sec.restricted && sec.restricted(nx, ny)) || sec._fixSet.has(nx + "," + ny)) continue;
      const ns = key(nx, ny, nh);
      if (prev[ns] !== -1) continue;
      prev[ns] = s; q.push(ns);
    }
  }
  return -1;
}
/* on the inbound leg: at the IAF or between it and the VOR, on the runway heading */
function onInbound(p, ap) {
  if (p.h !== ap.rwy) return false;
  for (let k = VOR_D; k <= VOR_D + IAF_D; k++) if (p.x === ap.x - DIRS[ap.rwy][0] * k && p.y === ap.y - DIRS[ap.rwy][1] * k) return true;
  return false;
}
/* miles out on the runway's extended centerline, on the approach side; -1 off it */
function finalDist(ap, x, y) {
  const [dx, dy] = DIRS[ap.rwy], d = dx ? (ap.x - x) / dx : (ap.y - y) / dy;
  return d >= 1 && x === ap.x - dx * d && y === ap.y - dy * d ? d : -1;
}
/* a dot a plane cleared to land can start down from: on the centerline,
 * on the runway heading, and far enough out to lose its height at 1,000 ft
 * a mile. Lower and further out it flies level until it meets that slope. */
function joinsFinal(ap, x, y, h, alt) { return h === ap.rwy && finalDist(ap, x, y) >= Math.max(alt, 2); }
/* how a plane joins the hold from wherever it is */
function joinNav(p, ap, apIdx) {
  const vor = vorOf(ap);
  if (p.x === vor.x && p.y === vor.y && p.h === ap.rwy) return "atvor";
  if (p.nav === "pattern" && p.landAp === apIdx) return "pattern";
  if (onInbound(p, ap)) return "vor";
  return "iaf";
}

/* the heading a plane enters on from a fix, toward tgt; one that would
 * leave the map at once is nudged inward */
function entryHeading(sec, f, tgt) {
  let h = bearing(f.x, f.y, tgt.x, tgt.y);
  for (let i = 0; i < 4 && !inside(sec, f.x + DIRS[h][0], f.y + DIRS[h][1]); i++) h = (h + 1) % 8;
  return h;
}

/* the dots an arrival left alone flies from (x,y) on heading h to the IAF,
 * with the arrival's own navigation, into out */
function route(sec, x, y, h, ap, out) {
  const iaf = iafOf(ap), goal = { x: iaf.x, y: iaf.y, h: ap.rwy }, p = { x, y, h };
  for (let i = 0; i < 120 && inside(sec, p.x, p.y); i++) {
    out.add(p.x + "," + p.y);
    if (p.x === iaf.x && p.y === iaf.y && p.h === ap.rwy) break;
    const nh = navHeading(sec, p, goal);
    if (nh < 0) break;
    p.h = nh; p.x += DIRS[nh][0]; p.y += DIRS[nh][1];
  }
  return out;
}

/* The traffic lanes drawn bright: the routes arrivals fly from each fix to
 * the main airport's IAF, so a lane is where a plane will go. A second
 * airport's lanes would cover a quarter of the scope; the scope lights
 * those one selected plane at a time. Cosmetic. */
function lanes(sec) {
  const out = new Set(), ap = sec.airports[0];
  for (const f of sec.fixes) route(sec, f.x, f.y, entryHeading(sec, f, iafOf(ap)), ap, out);
  return out;
}

/* Where a plane is going: the dots it will fly if told nothing more, a
 * command it has been given but not yet acted on included. Flown by the
 * engine itself, on a copy of the shift with no other traffic, until it
 * lands, leaves, has gone round its hold once, or max dots. */
function flightPath(S, p, max = 40) {
  const q = JSON.parse(JSON.stringify(p));
  const T = { ...S, planes: [q], events: [], done: [], next: Infinity, stormAt: -1, storm: S.storm && { ...S.storm }, end: Infinity, over: false };
  const out = [{ x: q.x, y: q.y }];
  let held = -1;
  for (let t = 0; t < max * 8 && out.length <= max && T.planes.includes(q); t++) {
    tick(T);
    const last = out[out.length - 1];
    if (q.x === last.x && q.y === last.y) continue;
    out.push({ x: q.x, y: q.y });
    if (q.nav === "pattern" && held < 0) held = out.length;
    if (held >= 0 && out.length - held >= 8) break;
  }
  return out;
}

/* ---- a shift ---- */
function newShift({ sector, shift, rank = 1, seed = 1, practice = false }) {
  const sec = SECTORS[sector], sh = SHIFTS[shift];
  const S = {
    sector, shift, rank, seed, practice, rng: seed | 0,
    t: 0, end: sh.min * TPM, over: false,
    planes: [], next: 0, letter: 0, nums: {},
    DN: shift + 1 + sector + 1 + 3,          /* the original's traffic number */
    storm: null, stormAt: -1,
    conflictTicks: 0, delayTicks: 0, delayPuma: 0,
    done: [],                                /* every flight's outcome */
    log: [],                                 /* commands, for the replay */
    events: [],                              /* what happened this tick, for the UI */
    sel: null,
    hot: {},                                 /* the player's quick keys: digit -> plane letter */
  };
  /* thunderstorms: never on Trainee; Graveyard and Afternoon only at Denver;
   * about one shift in two. A storm thins the traffic: DN = max(8, 2DN/3). */
  const may = shift === 0 ? false : (shift <= 2 ? sec.storms === "always" : true);
  if (may && rnd(S) < 0.5) {
    S.stormAt = TPM * (2 + ri(S, Math.max(1, sh.min - 6)));
    S.DN = Math.max(8, Math.floor(S.DN * 2 / 3));

  S.group = Math.floor(S.DN / 3) + 2;        /* planes the sector holds at once */
  S.gap = Math.max(3, Math.round(160 / S.DN / 3));   /* ticks between new flight plans */
  S.cap = S.group + 3;
  S.next = 2;                                /* the first strip at once; its plane a minute later */
  return S;
}

function nextLetter(S) {
  const used = new Set(S.planes.map(p => p.id));
  for (let i = 0; i < LETTERS.length; i++) {
    const L = LETTERS[(S.letter + i) % LETTERS.length];
    if (!used.has(L)) { S.letter = (S.letter + i + 1) % LETTERS.length; return L; }
  }
  return null;
}

function makeFlight(S) {
  const sec = SECTORS[S.sector];
  const id = nextLetter(S);
  if (!id) return null;
  /* the shift's first flight: on the air in 15 seconds, not a minute, so
   * the scope is never empty for long; on a Trainee shift it is an arrival,
   * the one kind that flies itself to the VOR and waits to be taught on */
  const first = !Object.keys(S.nums).length;
  const kind = first && S.shift === 0 ? "arr" : pick(S, sec.mix);
  let al;
  const r = rnd(S);
  if (sec.ssc && r < sec.ssc && kind !== "tra") al = "AF";
  else if (sec.light && r < sec.ssc + sec.light && kind !== "tra") al = "N";
  else al = pick(S, sec.airlines);
  const cls = AIRLINES[al].cls;
  /* where it is going and coming from */
  const ports = sec.airports.filter(a => cls === "ssc" ? a.ssc : cls === "light" ? true : !a.lightOnly);
  const pw = {}; ports.forEach(a => { pw[sec.airports.indexOf(a)] = cls === "light" && a.lightOnly ? a.w * 4 : a.w; });
  const fixes = sec.fixes.filter(f => cls === "ssc" ? f.n === "PARIS" : f.n !== "PARIS");
  if (!fixes.length || !ports.length) return null;
  const ap = +pick(S, pw);
  let from, to, fromFix = null, toFix = null, toAp = null;
  if (kind === "arr") { fromFix = fixes[ri(S, fixes.length)]; toAp = ap; from = fromFix.n; to = sec.airports[ap].code; }
  else if (kind === "dep") { toFix = fixes[ri(S, fixes.length)]; from = sec.airports[ap].code; to = toFix.n; }
  else {
    fromFix = fixes[ri(S, fixes.length)];
    const others = fixes.filter(f => f !== fromFix && dist2(f, fromFix) > 100);
    toFix = others[ri(S, others.length)] || fixes.find(f => f !== fromFix);
    from = fromFix.n; to = toFix.n;
  }
  let num;
  do { num = al === "N" ? 100 + ri(S, 900) : 10 + ri(S, 890); } while (S.nums[al + num]);
  S.nums[al + num] = 1;
  const p = {
    id, al, num, cls, kind, from, to, toAp, landAp: null, apIdx: null,
    x: 0, y: 0, px: 0, py: 0, h: 0, alt: 5, th: null, talt: null, tdir: 0,
    mode: "pending", holdDir: 1, nav: null, pat: 0, period: CLASSES[cls].period, phase: 0,
    posted: S.t, enter: S.t + (first ? 2 : TPM), fuel: (kind === "arr" ? 15 : 60) * TPM, emergency: false,
    budget: 0, delay: 0, cmds: 0, conf: -99, next: null,
  };
  if (fromFix) {
    p.x = p.px = fromFix.x; p.y = p.py = fromFix.y;
    const tgt = kind === "arr" ? iafOf(sec.airports[ap]) : toFix;
    p.h = entryHeading(sec, fromFix, tgt);
    if (kind === "arr") p.nav = "iaf";
    const d = cheb(p, kind === "arr" ? sec.airports[ap] : toFix);
    p.budget = Math.round(d * p.period * 1.6) + 3 * TPM;
  } else {
    const a = sec.airports[ap];
    p.x = p.px = a.x; p.y = p.py = a.y; p.h = a.rwy; p.alt = 0; p.apIdx = ap;
    p.budget = 2 * TPM;                 /* two minutes on the ground is free */

/* ---- commands: each goes in the log for the replay ---- */
function callsign(p) { return AIRLINES[p.al].name + " " + p.num; }
function shortCall(p) { return AIRLINES[p.al].code + p.num; }      /* DL101, PUM252: the tag on the scope */
function sayNum(n) { return String(n).split(""); }
function sayCall(p) { return [...AIRLINES[p.al].say, ...sayNum(p.num)]; }
function sayHdg(h) { return HDG[h].split(""); }
function sayAlt(a) { return a === 0 ? ["0"] : [String(a), "thousand"]; }
function altText(a) { return a === 0 ? "the field" : a + ",000"; }
function find(S, id) { return S.planes.find(p => p.id === id) || null; }
/* heard at any speed: a plane calling up on the frequency (true, a
   check-in), or a pilot with a problem ("urgent", ahead of the chatter) */
/* who: "ctl", or the plane whose pilot is talking; the pilot's line carries
   the callsign as `from`, so each pilot keeps one voice all shift */
function radio(S, who, text, say, flag) {
  const e = who === "ctl" ? { type: "radio", who, text, say } : { type: "radio", who: "pilot", from: who.al + who.num, text, say };
  if (flag === true) e.checkin = true; else if (flag) e[flag] = true;
  S.events.push(e);
}
function alarm(S, lamp, text) { S.events.push({ type: "alarm", lamp, text }); }

/* A command is said and logged at once, but the pilot needs a moment to
 * take it in: it waits as p.next until ACK_S seconds after it was sent, and
 * takes hold at the first dot after that. c.at is when it was sent, in
 * ticks with the fraction (the UI's clock); a second command before then
 * simply replaces it. */
const ACK_S = 4;
const ACK = ACK_S / (60 / TPM);
function command(S, c) {
  const p = find(S, c.id);
  if (!p || S.over) return false;
  if (c.op === "status") {
    if (p.mode === "pending") return false;
    radio(S, "ctl", callsign(p) + ", say heading and altitude", [...sayCall(p), "say", "heading", "and", "altitude"]);
    radio(S, p, "heading " + HDG[p.h] + ", " + altText(p.alt) + ", " + (p.emergency ? Math.ceil(p.fuel / TPM) + " minutes fuel, " : "") + callsign(p),
      ["heading", ...sayHdg(p.h), "altitude", ...sayAlt(p.alt), ...sayCall(p)]);
    S.log.push({ t: S.t, c });
    return true;
  }
  if (!sayCommand(S, p, c)) return false;
  p.next = { c, ready: (c.at != null ? c.at : S.t) + ACK };
  S.log.push({ t: S.t, c });
  return true;
}

/* the controller's words and the pilot's readback; false if the plane cannot take it */
function sayCommand(S, p, c) {
  const sec = SECTORS[S.sector];
  if (c.op === "vector") {
    if (p.mode === "pending") return false;
    if (p.mode === "final") { radio(S, p, callsign(p) + ", unable, on final", [...sayCall(p), "unable"]); return false; }
    if (p.mode === "ground") {
      const ap = sec.airports[p.apIdx];
      /* a plane on short final: the departure waits, under the LANDING! lamp,
       * the original's name for it */
      if (S.planes.some(q => q !== p && q.mode === "final" && q.landAp === p.apIdx)) {
        alarm(S, "LANDING", "LANDING! " + ap.code + " runway in use");
        radio(S, p, callsign(p) + ", holding short, traffic on final", [...sayCall(p), "unable"]);
        return false;
      }
      const alt = c.alt == null ? 5 : c.alt;
      radio(S, "ctl", callsign(p) + ", cleared for takeoff, fly heading " + HDG[c.h] + ", climb and maintain " + altText(alt),
        [...sayCall(p), "cleared", "for", "takeoff", "heading", ...sayHdg(c.h), "climb", "and", "maintain", ...sayAlt(alt)]);
      radio(S, p, "rolling, heading " + HDG[c.h] + ", " + callsign(p), ["rolling", "heading", ...sayHdg(c.h), ...sayCall(p)]);
      return true;
    }
    const d = turnDelta(p.h, c.h), dir = c.dir || (d < 0 ? -1 : d > 0 ? 1 : 0);
    const turn = dir < 0 ? "turn left" : dir > 0 ? "turn right" : "fly";
    const vert = c.alt > p.alt ? "climb and maintain" : c.alt < p.alt ? "descend and maintain" : "maintain";
    radio(S, "ctl", callsign(p) + ", " + turn + " heading " + HDG[c.h] + ", " + vert + " " + altText(c.alt),
      [...sayCall(p), ...(dir < 0 ? ["turn", "left"] : dir > 0 ? ["turn", "right"] : []), "heading", ...sayHdg(c.h),
       ...(c.alt > p.alt ? ["climb", "and", "maintain"] : c.alt < p.alt ? ["descend", "and", "maintain"] : ["maintain"]), ...sayAlt(c.alt)]);
    radio(S, p, (dir < 0 ? "turning left " : dir > 0 ? "turning right " : "") + "heading " + HDG[c.h] + ", " +
      (c.alt > p.alt ? "climbing " : c.alt < p.alt ? "descending " : "maintaining ") + altText(c.alt) + ", " + callsign(p),
      ["roger", ...(dir < 0 ? ["turning", "left"] : dir > 0 ? ["turning", "right"] : []), "heading", ...sayHdg(c.h),

  }
  if (c.op === "hold") {
    if (p.mode !== "fly" && p.mode !== "hold" && p.mode !== "land") return false;
    const side = (c.dir || 1) > 0 ? "right" : "left";
    const lower = c.alt != null && c.alt !== p.alt;
    radio(S, "ctl", callsign(p) + ", hold " + side + " turns at the VOR" + (lower ? ", " + altText(c.alt) : ""),
      [...sayCall(p), "hold", side, "at", "the", "vor", ...(lower ? ["at", ...sayAlt(c.alt)] : [])]);
    radio(S, p, "roger, holding at the VOR" + (lower ? ", " + altText(c.alt) : "") + ", " + callsign(p),

/* the pilot does it: at a dot for a plane in the air, on the next tick for
 * one on the ground. False if it cannot be done now (it waits, or is moot) */
function applyCommand(S, p, c) {
  const sec = SECTORS[S.sector];
  if (c.op === "vector" && p.mode === "ground") {
    if (S.planes.some(q => q !== p && q.mode === "final" && q.landAp === p.apIdx)) return false;   /* still waiting for the runway */
    p.mode = "fly"; p.th = c.h; p.talt = c.alt == null ? 5 : c.alt; p.alt = 0; p.phase = 0; p.cmds++;
    p.climbout = true;                  /* down the runway first: see stepPlane */
    const d = turnDelta(p.h, c.h);
    p.tdir = c.dir || (d < 0 ? -1 : d > 0 ? 1 : 0);
    p.enter = S.t;
    p.budget = Math.round(cheb(p, sec.fixes.find(f => f.n === p.to)) * p.period * 1.6) + 3 * TPM;
    return true;
  }
  if (p.mode === "final" || p.mode === "ground" || p.mode === "pending") return true;              /* moot now */
  if (c.op === "vector") {
    const d = turnDelta(p.h, c.h);
    p.tdir = c.dir || (d < 0 ? -1 : d > 0 ? 1 : 0);
    p.th = c.h; p.talt = c.alt;
    p.mode = "fly"; p.nav = null; p.cmds++;

    const apIdx = p.toAp != null ? p.toAp : 0, nav = joinNav(p, sec.airports[apIdx], apIdx);
    p.mode = "hold"; p.holdDir = c.dir || 1; p.th = null; p.cmds++; p.landAp = apIdx;
    if (nav === "atvor") { p.nav = "pattern"; p.pat = 0; } else p.nav = nav;
    if (c.alt != null) p.talt = c.alt;
    else if (p.talt === 0) p.talt = p.alt;              /* pulled off the approach: level off */
  } else if (c.op === "land") {
    /* the shortest way onto the centerline, wherever it is: not back round
     * by the IAF when it is already lined up or crossing the final */

/* ---- the clock ---- */
/* tag: what went wrong, in a few words, for the mark the scope leaves where
 * it happened and the shift report's list of incidents */
function finish(S, p, outcome, lamp, text, tag) {
  p.mode = "done"; p.outcome = outcome;

  if (lamp) alarm(S, lamp, text);
  S.events.push({ type: "gone", id: p.id, outcome, call: callsign(p), short: shortCall(p), tag: tag || "", x: p.x, y: p.y });
  if (S.sel === p.id) S.sel = null;

function stepPlane(S, p) {

  /* 1. what it does at this dot: a turn, then altitude. A departure's first
   * dot is its climb-out: straight down the runway to 1,000 ft, whatever it
   * was told, because it is taking off and not hovering; the clearance's
   * turn and climb start from the dot after. */

  let level = false;
  if (climbout) { p.climbout = false; p.alt = Math.max(1, p.alt); }

    const ap = sec.airports[p.mode === "land" ? p.landAp : (p.toAp != null ? p.toAp : 0)];
    const iaf = iafOf(ap), vor = vorOf(ap);

    if (p.nav === "join") {

      const top = Math.max(p.alt, p.talt == null ? 0 : p.talt);
      if (joinsFinal(ap, p.x, p.y, p.h, top)) { p.nav = "approach"; p.talt = 0; }

    /* "approach": straight down the runway heading, level until the slope */
    if (p.nav === "approach") level = finalDist(ap, p.x, p.y) > p.alt;
    if (p.nav === "iaf") {
      if (p.x === iaf.x && p.y === iaf.y && p.h === ap.rwy) p.nav = "vor";
      else {

       * heading the runway's, or this is a crash */

        radio(S, p, callsign(p) + ", runway in sight, good-day", [...sayCall(p), "goodday"]);

  const fix = sec.fixes.find(f => f.x === p.x && f.y === p.y);

    else if (p.kind === "arr") finish(S, p, "badexit", "EXIT FIX", callsign(p) + " was bound for " + p.to, "ARRIVAL LEFT · bound for " + p.to);
    else if (fix.n !== p.to) finish(S, p, "badexit", "EXIT FIX", callsign(p) + " left via " + fix.n + ", not " + p.to, "WRONG FIX · " + fix.n + ", not " + p.to);
    else if (p.alt !== 4) finish(S, p, "badexit", "EXIT ALT", callsign(p) + " left at " + altText(p.alt) + ", not 4,000", "EXIT HEIGHT · " + altText(p.alt) + ", not 4,000");
    else {
      finish(S, p, "exited");
      radio(S, "ctl", callsign(p) + ", contact center, good-day", [...sayCall(p), "contactcenter", "goodday"]);

  }

  if (sec.restricted && sec.restricted(p.x, p.y)) { finish(S, p, "crash", "CRASH", callsign(p) + " was shot down over the restricted zone", "SHOT DOWN · restricted zone"); return; }
}

/* a thunderstorm: a blob of cells, moving east at a light plane's pace */

    const by = S.planes.filter(p => (p.mode === "fly" || p.mode === "hold") && p.alt > 0).sort((a, b) => a.x - b.x)[0];
    if (by) {
      const side = S.storm.y + 0.5 < sec.H / 3 ? "northwest" : S.storm.y + 0.5 > sec.H * 2 / 3 ? "southwest" : "west";

        else { p.mode = "fly"; p.phase = 0; radio(S, p, callsign(p) + " with you, " + altText(p.alt) + ", for " + p.to, [...sayCall(p), "with", "you", "altitude", ...sayAlt(p.alt)], true); }

/* ---- the shift's report and the career ---- */
function tally(S) {

/* ---- a look one dot ahead: the pairs that will have lost separation

/* the left hand and the numpad, drawn: 34px caps on a 46px pitch, and a

const KEYMAP_ACT = { hdgL: "heading left", hdgR: "heading right", altUp: "height up", altDown: "height down",

  const off = { L: [-5, 0, "end"], R: [5, 0, "start"], T: [0, -9, "middle"], B: [0, 9, "middle"] };
  const leads = leaders.map(([code, side, ...lines]) => {
    const [x, y] = lines[0][lines[0].length - 1], [dx, dy, anchor] = off[side];
    return lines.map(l => `<polyline points="${l.join(" ")}"/><circle cx="${l[0][0]}" cy="${l[0][1]}" r="2"/>`).join("") +
      `<text x="${x + dx}" y="${y + dy}" text-anchor="${anchor}">${KEYMAP_ACT[KEYS[code]]}</text>`;
  }).join("");

const KEYMAP_K = 34, KEYMAP_P = 46, KEYMAP_G = KEYMAP_P - KEYMAP_K;
function keymapLeft() {

  const L = X - 18, R = kx(2, 2) + K + 16, B = ky(3) + K + 10, sx = kx(1, 2) + 23, sw = 136;
  const keys = [..."QWEASDZXC"].map((c, i) => [c, "Key" + c, kx(i % 3, i / 3 | 0), ky(i / 3 | 0), K, K]);
  keys.push(["space", "Space", sx, ky(3), sw, K]);
  const side = (code, c, r, s) => [code, s, s === "L" ? [[kx(c, r), cy(r)], [L, cy(r)]] : [[kx(c, r) + K, cy(r)], [R, cy(r)]]];

    side("KeyQ", 0, 0, "L"), side("KeyA", 0, 1, "L"), side("KeyZ", 0, 2, "L"),
    ["KeyW", "T", [[kx(1, 0) + K / 2, Y], [kx(1, 0) + K / 2, Y - 18]]],
    side("KeyE", 2, 0, "R"), side("KeyD", 2, 1, "R"), side("KeyC", 2, 2, "R"),

  const kx = c => X + c * P, ky = r => Y + r * PY, cx = c => kx(c) + K / 2, cy = r => ky(r) + K / 2;

  const key = (cap, code, c, r, wu = 1, hu = 1) => [cap, code, kx(c), ky(r), wu * P - G, hu * PY - GY];

function showHelp(tab = 0) {
  openSheet("Help", { tab, tabs: [
    ["Playing", `
      <p class="gk-note">First time? Start a career at Level 1: the coach walks you through your first plane.</p>
      <p><b>You are the approach controller.</b> Every plane on the scope is yours until it lands at one of your airports or leaves through the fix on its flight plan. Two planes within <b>3 miles</b> of each other need <b>1,000 feet</b> between their heights, and on neighbouring dots, <b>2,000 feet</b>.</p>
      ${GLYPH_KEY}
      <p>Planes fly straight and level until told otherwise, and change heading and height only at the dots: 45 degrees and 1,000 feet a mile. On the Learning scope a selected plane shows where it is going, dot to dot: straight on, the route an arrival flies itself to the VOR, or a turn you have given that it has not reached yet.</p>
      <p><b>Arrivals</b> enter at 5,000 feet, fly to the airport's VOR by themselves and hold there. Stack them at different heights, then clear them to land one at a time. <b>Overflights</b> must leave through their exit fix at exactly <b>4,000 feet</b>. <b>Departures</b> wait on the flight-plan board until you give them a heading and height.</p>
      <p>At 10 minutes of fuel a pilot calls <b>minimum fuel</b>; below 8 it declares an <b>emergency</b>: land the plane at the nearest airport, which its strip names. A plane in a thunderstorm, over Denver's mountains below 4,000 feet, or over Washington's restricted zone, is lost.</p>
      <p>The shift ends on the hour. No crashes, no bad exits and under 30 seconds of conflict gets you promoted; a crash, a bad exit, over a minute of conflict or 45 minutes of delay ends your career. A GS-7 trainee is never fired. When something goes wrong the scope marks the spot and says what happened, and the shift report lists each one with a replay from a minute before.</p>
      <p class="gk-note">${CREDIT}</p>`],
    ["Commands", `
      <p>Click a plane or its strip, or <kbd>Tab</kbd> down the board. <kbd>Shift</kbd>+<kbd>1</kbd>–<kbd>9</kbd> bookmarks the selected plane on a digit, as an RTS does its groups, and the digit alone brings it back. Pick a <b>heading</b> on the compass and a <b>height</b>, then <b>Send</b>. A command is always heading and height together, and the new one replaces the old. The pilot reads it back.</p>
      <h3>When they act</h3><p>The pilot takes about four seconds to take a command in, then acts at the next dot. Sent just before a plane reaches a dot, it flies through that one and turns at the one after. A second command before the first is acted on replaces it; once the first is on the air, the controller says "correction". The <b>Learning</b> scope (<kbd>L</kbd>, or Settings) marks the dot where each command will take hold, and turns two planes amber one dot before they lose separation. On it a pilot heading for trouble in the next six miles calls it in, and the strip says what: OFF COURSE, EXIT HEIGHT, WEATHER, TERRAIN or RESTRICTED. On any scope a pilot three minutes in the hold asks out of it, and the first to see a thunderstorm reports it.</p>
      <h3>Your standing</h3><p>The header counts the shift's <b>errors</b> (crashes, bad exits, exits with an emergency), <b>conflict</b> seconds and <b>delay</b> minutes as they happen: under 30 seconds of conflict is a promotion, over a minute is the end of a career, and so are a crash, a bad exit or 45 minutes of delay. A trainee is never fired.</p>
      <h3>Hold</h3><p>Right or left turns at the airport's VOR, eight miles round, at the height given. Arrivals do this on their own when they get there.</p>

cv.addEventListener("pointerdown", e => {

  const r = cv.getBoundingClientRect(), mx = (e.clientX - r.left) * dpr, my = (e.clientY - r.top) * dpr;
  let best = null, bd = (pitch * 1.6) ** 2;
  for (const p of S.planes) {
    if (p.mode === "pending" || p.mode === "ground") continue;
    const pos = planePos(p), d = (gx(pos.x) - mx) ** 2 + (gy(pos.y) - pitch * .5 - my) ** 2;
    if (d < bd) { bd = d; best = p; }
  }
  /* nothing in the air there: the departures waiting at the airport clicked,
     the next one each click */
  if (!best) {
    const ground = S.planes.filter(p => p.mode === "ground" && (gx(p.x) - mx) ** 2 + (gy(p.y) - my) ** 2 < (pitch * 1.4) ** 2);
    if (ground.length) best = ground[(ground.findIndex(p => p.id === ui.sel) + 1) % ground.length];
  }
  select(best ? best.id : null);
});

/* ---- the Konami code: up up down down left right left right B A, on the
   title or on the scope. A promotion, and every facility and shift open.
   It listens ahead of everything else, so the final A is spent here and
   never reaches the title's About or a plane's heading. ---- */
const KONAMI = ["ArrowUp", "ArrowUp", "ArrowDown", "ArrowDown", "ArrowLeft", "ArrowRight", "ArrowLeft", "ArrowRight", "KeyB", "KeyA"];
let konamiAt = 0;
document.addEventListener("keydown", e => {
  if (sheet || e.ctrlKey || e.metaKey || e.altKey || document.querySelector(".gk-sheet,.gk-boot")) { konamiAt = 0; return; }
  if (e.code === KONAMI[konamiAt]) {
    if (++konamiAt < KONAMI.length) return;
    konamiAt = 0;
    e.preventDefault(); e.stopImmediatePropagation();
    konami();
  } else konamiAt = e.code === "ArrowUp" ? (konamiAt === 2 ? 2 : 1) : 0;
}, true);
function konami() {
  if (!career) career = { rank: 1, total: 0, skill: 1, shifts: 0, since: Date.now() };
  const was = career.rank;
  career.rank = Math.min(MAX_RANK, career.rank + 1);
  career.unlocked = true;
  save(KEY_CAREER, career);
  if (loop.running && !replay) loop.paused = true;
  play("end");
  if (titleOpen) refreshTitle();
  alertSheet((career.rank > was ? "Promoted to " + gsOf(career.rank) + "." : gsOf(career.rank) + " is the top of the ladder.") +
    " Every facility and every shift is open to you. A shift in progress keeps the rank it started with.", "Clearance granted");
}

/* ---- keys: one hand on the mouse, the other on the keys, whichever hand
   that is. Three layouts do the same things, by physical key (e.code), so
   the numpad works with Num Lock either way. The left hand sits on WASD,
   with Z and C below it for the holds, Q above for Say and E for Send; the
   right hand on the arrows with [ ] / and Enter, or on the numpad as the
   left hand mirrored: 1 3 hold, 7 sends, 9 says, 0 runs the clock. Space
   only ever runs the clock. Esc cancels, Tab walks the board. The panel's
   hints follow the layout last used. ---- */
const LAYOUTS = {
  left:   { hdgL: "KeyA", hdgR: "KeyD", altUp: "KeyW", altDown: "KeyS", holdL: "KeyZ", holdR: "KeyC", status: "KeyQ", send: "KeyE", fast: "Space" },
  arrows: { hdgL: "ArrowLeft", hdgR: "ArrowRight", altUp: "ArrowUp", altDown: "ArrowDown", holdL: "BracketLeft", holdR: "BracketRight", status: "Slash", send: "Enter", fast: "Space" },
  numpad: { hdgL: "Numpad4", hdgR: "Numpad6", altUp: "Numpad8", altDown: "Numpad5", holdL: "Numpad1", holdR: "Numpad3", status: "Numpad9", send: "Numpad7", fast: "Numpad0" },
};
/* code → action, with a few aliases; code → the one layout it belongs to,
   null for a key two layouts share */
const KEYS = { Numpad2: "altDown", NumpadEnter: "send", Period: "fast" }, KEY_LAYOUT = { Numpad2: "numpad", NumpadEnter: "numpad" };
for (const l in LAYOUTS) for (const a in LAYOUTS[l]) {
  const c = LAYOUTS[l][a]; KEYS[c] = a;
  KEY_LAYOUT[c] = c in KEY_LAYOUT ? null : l;
}
if (!LAYOUTS[prefs.layout]) prefs.layout = "left";
const GLYPH = { Space: "Space", ArrowUp: "↑", ArrowDown: "↓", ArrowLeft: "←", ArrowRight: "→", BracketLeft: "[", BracketRight: "]", Enter: "⏎", NumpadEnter: "⏎", Slash: "/", NumpadMultiply: "*" };
const glyph = (c, long) => long && /Enter$/.test(c) ? "Enter" : GLYPH[c] || c.replace(/^Key|^Numpad/, "");
/* the key for an action in the layout last used, for the hints */
const hint = (a, long) => glyph(LAYOUTS[prefs.layout][a], long);
document.addEventListener("keydown", e => {
  if (sheet) { if (e.key === "Escape") { e.preventDefault(); closeSheet(); } else if (e.key === "Tab") trapTab(sheet.el, e); else if (sheet.onKey && !e.ctrlKey && !e.metaKey && !e.altKey) sheet.onKey(e); return; }
  if (titleOpen) { if (!e.ctrlKey && !e.metaKey && !e.altKey) titleKey(e); return; }
  if (!S || !loop.running) return;
  /* Space only ever runs the clock, whatever has the focus: a button it
     would otherwise press is Enter's */
  if (KEYS[e.code] === "fast" && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); loop.fast = true; return; }
  /* a button in the header or the panel has the focus: Tab and Enter are
     the browser's there, and walk or press the buttons */
  const onButton = e.target.closest && e.target.closest("#hud, #panel, #scope-wrap button");
  if (onButton && (e.key === "Tab" || (e.key === "Enter" && e.target.tagName === "BUTTON"))) return;
  if (e.key === "F6") { e.preventDefault(); region(e.shiftKey ? -1 : 1); return; }
  /* quick keys, the way an RTS does its groups: Ctrl (or Shift) and a digit
     on the top row puts the selected plane on that digit; the digit alone
     selects it. The numpad's digits stay controls. */
  const digit = /^Digit(\d)$/.test(e.code) ? e.code.slice(5) : null;
  if (digit && (e.ctrlKey || e.shiftKey) && !e.altKey && !e.metaKey) {
    e.preventDefault();
    if (!ui.sel || replay) return;
    for (const d in S.hot) if (S.hot[d] === ui.sel) delete S.hot[d];
    S.hot[digit] = ui.sel; play("select"); renderStrips(); renderPanel();
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (digit) { e.preventDefault(); if (S.hot[digit] && find(S, S.hot[digit])) select(S.hot[digit]); return; }
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key, a = KEYS[e.code];
  if (k === "Backspace") { e.preventDefault(); toTitle(); return; }
  if (k === "m") { toggleMute(); return; }
  if (k === "h" || k === "?") { showHelp(); return; }
  if (k === "l") { toggleAids(); return; }
  if (k === "p" || k === "Pause") { e.preventDefault(); togglePause(); return; }
  /* Esc deselects, then puts the tips away; in a replay it goes back to the
     report. Leaving the shift is MENU's, which saves it */
  if (k === "Escape") {
    if (replay && replay.from) backToReport();
    else if (ui.sel) select(null);
    else if (!$("coach").hidden) coach(COACH.length);
    return;
  }
  if (k === "Tab") { e.preventDefault(); cycle(e.shiftKey ? -1 : 1); return; }
  if (replay || !a) return;
  /* the hints follow the hand on the keys */
  const l = KEY_LAYOUT[e.code];
  if (l && l !== prefs.layout) { prefs.layout = l; save(KEY_PREFS, prefs); renderPanel(); if (ui.coach === 2) coach(2); }
  const p = ui.sel && find(S, ui.sel);
  if (!p) return;
  e.preventDefault();
  if (a === "hdgL") ui.h = (ui.h + 7) % 8;
  else if (a === "hdgR") ui.h = (ui.h + 1) % 8;
  else if (a === "altUp") ui.alt = Math.min(5, ui.alt + 1);
  else if (a === "altDown") ui.alt = Math.max(p.mode === "ground" ? 1 : 0, ui.alt - 1);
  else { act(a); return; }
  renderPanel();
  /* the setting, said once to a screen reader, from one node that stays put */
  const tip = cmdTip(p);
  $("sr-set").textContent = (ui.alt === 0 ? "land at " + SECTORS[S.sector].airports[landingAt(p)].code : "heading " + HDG[ui.h] + ", " + ui.alt + ",000") + (tip ? ". " + tip : "");
});
document.addEventListener("keyup", e => { if (KEYS[e.code] === "fast") { loop.fast = false; if (S && loop.running) e.preventDefault(); } });
/* F6 and Shift-F6: the keyboard's way between the screen's parts, the
   header's buttons, the board, the command panel, and a note over the scope */
function region(dir) {
  const parts = [
    $("hud").querySelector("button"),
    $("strip-list").querySelector(".strip.sel") || $("strip-list").querySelector('.strip[tabindex="0"]'),
    $("panel").querySelector("button:not(:disabled)"),
    !$("notice").hidden && $("notice").querySelector("button"),
    !$("coach").hidden && $("coach").querySelector("button"),
  ].filter(el => el && el.offsetParent);      /* a part a phone has put away is skipped */
  if (!parts.length) return;
  const zone = el => el && el.closest ? el.closest("#hud, #strip-list, #panel, #notice, #coach") : null, cur = zone(document.activeElement);
  const i = cur ? parts.findIndex(el => zone(el) === cur) : -1;
  parts[i < 0 ? (dir > 0 ? 0 : parts.length - 1) : (i + dir + parts.length) % parts.length].focus();
}
/* Tab: the next plane down the board that can take a command; Shift-Tab, up */
function cycle(dir) {
  const list = S.planes.filter(p => p.mode !== "pending");
  if (!list.length) return;
  const i = list.findIndex(p => p.id === ui.sel);
  select(list[(i + dir + list.length) % list.length].id);
}
window.addEventListener("blur", () => { loop.fast = false; });
document.addEventListener("visibilitychange", () => { if (document.hidden && loop.running && !replay) { loop.paused = true; } });
function togglePause() { if (!S || S.over) return; loop.paused = !loop.paused; $("btn-pause").setAttribute("aria-pressed", loop.paused ? "true" : "false"); }
/* a button pressed with the mouse gives the focus back, so Enter still
   sends and Space still runs the clock, one hand on the mouse and the other
   on the keys; pressed from the keyboard it keeps it, and Tab walks on */
document.addEventListener("click", e => { const b = e.target.closest("#hud button, #panel button, #scope-wrap button"); if (b && e.detail > 0) b.blur(); });
$("btn-help").addEventListener("click", () => showHelp());
$("btn-menu").addEventListener("click", () => toTitle());
$("btn-pause").addEventListener("click", togglePause);
$("btn-aids").addEventListener("click", toggleAids);
/* fast time while the button is held, as Space is */
const fastBtn = $("btn-fast");
const fastOff = () => { loop.fast = false; fastBtn.classList.remove("on"); };
fastBtn.addEventListener("pointerdown", e => { e.preventDefault(); loop.fast = true; fastBtn.classList.add("on"); });
for (const ev of ["pointerup", "pointercancel", "pointerleave"]) fastBtn.addEventListener(ev, fastOff);
fastBtn.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); loop.fast = true; fastBtn.classList.add("on"); } });
fastBtn.addEventListener("keyup", fastOff);

/* ---- the title's scene: a scope, sweeping ---- */
function sceneSVG() {
  let seed = 9;
  const r = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  let o = `<svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice"><defs>
    <radialGradient id="pa-glow" cx="600" cy="400" r="420" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#54f2ff" stop-opacity=".05"/><stop offset="1" stop-color="#54f2ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="pa-sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#54f2ff" stop-opacity="0"/><stop offset="1" stop-color="#54f2ff" stop-opacity=".22"/></linearGradient></defs>
    <circle cx="600" cy="400" r="420" fill="url(#pa-glow)"/>`;
  for (let x = 0; x <= 1200; x += 30) for (let y = 0; y <= 800; y += 30) o += `<rect x="${x - 1}" y="${y - 1}" width="2" height="2" fill="#182438"/>`;
  for (const rad of [140, 280, 420]) o += `<circle cx="600" cy="400" r="${rad}" fill="none" stroke="#1b2540" stroke-width="1"/>`;
  o += `<line x1="600" y1="-20" x2="600" y2="820" stroke="#1b2540"/><line x1="-20" y1="400" x2="1220" y2="400" stroke="#1b2540"/>`;
  void r;
  /* the sweep turns clockwise; its glow trails behind the line, so the wedge
     sits counter-clockwise of it and is brightest at the line */
  o += `<g class="sweep"><path d="M600 400 L600 -40 A440 440 0 0 0 289 89 Z" fill="url(#pa-sweep)"/><line x1="600" y1="400" x2="600" y2="-40" stroke="#54f2ff" stroke-opacity=".5" stroke-width="2"/></g></svg>`;
  return o;
}

/* ---- the traffic drifting under the title: the game's own glyphs, flying
   straight with the odd 45-degree turn, flashing red when two get within
   three miles at the same height, as they do on the scope ---- */
const demo = { planes: [], last: 0, cv: null };
function demoStart() {
  demo.cv = $("scene-cv");
  if (demo.planes.length) return;
  for (let i = 0; i < 10; i++) demo.planes.push({
    x: Math.random() * 40, y: Math.random() * 24, h: Math.floor(Math.random() * 8), alt: 1 + Math.floor(Math.random() * 5),
    id: LETTERS[i % LETTERS.length], puma: i % 4 === 1, turnAt: 2 + Math.random() * 10, conf: false,
  });
}
function demoRender(ts) {
  const c = demo.cv; if (!c || !c.isConnected) return;
  const dt = Math.min(0.1, (ts - demo.last) / 1000); demo.last = ts;
  const w = c.clientWidth, h = c.clientHeight;
  if (!w || !h) return;
  const d = Math.min(2, window.devicePixelRatio || 1);
  if (c.width !== Math.round(w * d) || c.height !== Math.round(h * d)) { c.width = Math.round(w * d); c.height = Math.round(h * d); }
  const g = c.getContext("2d"), pitch = Math.max(c.width / 40, c.height / 24), ox = (c.width - 40 * pitch) / 2, oy = (c.height - 24 * pitch) / 2;
  g.clearRect(0, 0, c.width, c.height);
  g.font = `${Math.max(9, pitch * .55)}px ${getComputedStyle(document.body).fontFamily}`;
  g.textBaseline = "middle"; g.textAlign = "center";
  const still = reduced();
  for (const p of demo.planes) {
    if (!still) {
      p.turnAt -= dt;
      if (p.turnAt <= 0) { p.h = (p.h + (Math.random() < .5 ? 1 : 7)) % 8; p.turnAt = 3 + Math.random() * 9; if (Math.random() < .3) p.alt = Math.max(1, Math.min(5, p.alt + (Math.random() < .5 ? 1 : -1))); }
      const v = 0.45 * dt / (Math.abs(DIRS[p.h][0]) + Math.abs(DIRS[p.h][1]) === 2 ? Math.SQRT2 : 1);
      p.x += DIRS[p.h][0] * v; p.y += DIRS[p.h][1] * v;
      if (p.x < -2) p.x = 42; if (p.x > 42) p.x = -2; if (p.y < -2) p.y = 26; if (p.y > 26) p.y = -2;
    }
    p.conf = false;
  }
  for (let i = 0; i < demo.planes.length; i++) for (let j = i + 1; j < demo.planes.length; j++) {
    const a = demo.planes[i], b = demo.planes[j];
    if (a.alt === b.alt && (a.x - b.x) ** 2 + (a.y - b.y) ** 2 < 9) a.conf = b.conf = true;
  }
  const blink = ((ts / 150) | 0) % 2 === 0;
  for (const p of demo.planes) {
    const col = p.conf && blink ? "#ff5266" : p.conf ? "#7a2a35" : p.puma ? "rgba(180,125,255,.55)" : "rgba(84,242,255,.45)";
    drawPlane(g, ox + p.x * pitch, oy + p.y * pitch, p.h, p.alt, p.id, col, pitch);
  }
}

/* ============================================================
   INIT
   ============================================================ */
function init() {
  console.log("%cPuma Approach", "color:#54f2ff;font-size:20px;font-weight:bold;font-family:monospace;");
  console.log("%cPuma Approach — greykit.com", "color:#dbe4fb;font-size:12px;font-family:monospace;");
  console.log("%cThree miles or a thousand feet. Never less.", "color:#7d8aa8;font-size:11px;font-family:monospace;");
  $("scene").innerHTML = '<canvas id="scene-cv" aria-hidden="true"></canvas>' + sceneSVG();
  demoStart();
  /* the integrated intro (games-meta STANDARD.md §14): the boot with the
     cat, a hold for the press that lets sound play, then the title over the
     scope with its music and the pilot */
  /* the boot's sound is the game's own, in place of the cat: the music and
     the pilot, keying up 0.4 s into the boot. The intro plays it only when
     the browser already lets the page play -- arriving from the arcade's
     click -- so a page loaded cold drops the pilot and the press starts the
     music alone. A key or click that skips the boot fades the pilot, as the
     boot did before the intro came. */
  let bootUp = false;
  const bootSkip = () => { if (bootUp) { bootUp = false; radioFade(0.6); } };
  const pilotBoot = (ac, out, { since = 0 } = {}) => {
    if (!document.querySelector(".gk-boot")) return;
    bootUp = true;
    window.addEventListener("keydown", bootSkip, true);
    window.addEventListener("pointerdown", bootSkip, true);
    musicStart();
    radioStart(Math.max(0.05, 0.4 - since));
  };
  const intro = startIntro({ lines: [bootReloadLine(), "one file: nothing to fetch"], audio, bootSound: muted ? false : pilotBoot });
  openTitle();
  const saved = shiftSaved();
  intro.finish({
    more: [saved ? `shift in progress: ${SECTORS[saved.sector].name}, ${SHIFTS[saved.shift].name}` :
      career ? `career on file: ${gsOf(career.rank)} · ${money(career.total)} earned` : "radar warm · 5 facilities on file"],
    /* ?hold=always shows the hold even where the browser would already play sound */
    hold: new URLSearchParams(location.search).get("hold") === "always" ? "always" : "auto",
    name: "lines",
    timing: { name: 150, step: 300, menu: 1250, done: 2300 },
    onContinue: () => { if (!muted) audio(); },
    /* the press resumed the context, but it may not be running yet */
    onTitle: () => {
      bootUp = false;
      window.removeEventListener("keydown", bootSkip, true);
      window.removeEventListener("pointerdown", bootSkip, true);
      if (muted || !audio()) return;
      const go = () => musicStart();
      if (AC.state === "running") go(); else AC.resume().then(go).catch(() => {});
    },
  });
  requestAnimationFrame(frame);
}
init();
</script>
