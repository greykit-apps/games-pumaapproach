<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* @gk-tokens-begin v0.1 -- greykit.games canon (games-meta STANDARD.md §4): the Tactical palette, PumaRally's (editor/render/palette.js). The copy of record is games-meta's canon/gk-tokens.css. */
:root{--bg:#05070f;--panel:#0a0e1a;--panel2:#0d1424;--line:#1b2540;--lit:#47609c;
  --text:#dbe4fb;--ink:#8b96b8;--dim:#7d8aa8;--accent:#54f2ff;--warn:#ffb000;--danger:#ff5266;
  --good:#4ade6a;--violet:#b47dff;--steel:#94a0c4;--blue:#4c8dff}
/* @gk-tokens-end */
:root {
  /* Tactical tribe: the canon block above is every Tactical game's palette.
     PumaApproach's own names follow: the scope's phosphor and its dots. */
  --scope: #06101c;
  --dot: #182438;
  --lane: #2a4064;
  --font-mono: ui-monospace, Menlo, Consolas, "Courier New", monospace;
}
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-mono); font-size: 13px; }
body { overflow: hidden; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 2px; cursor: pointer; padding: 6px 10px; }
@media (hover: hover) {
  button:hover:not(:disabled) { border-color: var(--lit); background: var(--panel2); }
  /* a lit button stays lit under the pointer, a shade brighter, as Send does */
  button.on:hover:not(:disabled) { color: var(--bg); background: #8af6ff; border-color: #8af6ff; }
}
button:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
button:disabled { opacity: .55; cursor: default; }
button.on { color: var(--bg); background: var(--accent); border-color: var(--accent); font-weight: 600; }
kbd { font: inherit; font-size: 10px; color: var(--dim); border: 1px solid var(--line); border-radius: 2px; padding: 0 4px; min-width: 16px; text-align: center; display: inline-block; }
a { color: var(--steel); }

/* ---- the game ---- */
#game { position: fixed; inset: 0; display: flex; flex-direction: column; }
#game[hidden] { display: none; }
#hud { display: flex; align-items: center; gap: 14px; padding: 6px 12px; border-bottom: 1px solid var(--line); background: var(--panel); min-height: 40px; flex-wrap: wrap; }
#hud .clock { font-size: 20px; font-weight: 600; letter-spacing: .08em; color: var(--accent); min-width: 7.5ch; font-variant-numeric: tabular-nums; }
#hud .where { color: var(--ink); font-size: 12px; line-height: 1.3; }
#hud .where b { color: var(--text); font-weight: 600; }
/* the shift's standing: conflict seconds against the 30 s that still gets a
   promotion and the minute that ends a career, delay against 45 minutes */
#standing { flex: 1; display: flex; align-items: baseline; gap: 6px; font-size: 11px; color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
#standing .k { letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
#standing .k + b { margin-right: 10px; }
#standing b { font-size: 13px; color: var(--text); font-weight: 600; }
#standing b.near { color: var(--warn); }
#standing b.over { color: var(--danger); }
#standing b.zero { color: var(--dim); font-weight: 400; }
#hud .btns { display: flex; gap: 6px; }
#hud .btns button { padding: 4px 9px; font-size: 12px; min-width: 32px; }
#hud .btns button[aria-pressed="true"] { color: var(--bg); background: var(--accent); border-color: var(--accent); font-weight: 600; }
#btn-fast.on { color: var(--bg); background: var(--accent); border-color: var(--accent); }
#speed { color: var(--ink); font-size: 11px; display: none; }
#speed.on { display: inline; }

#main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) clamp(300px, 27vw, 440px); }
#left { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
/* the scope fills the left pane, anchored to the bottom; the radio and the
   alarm lamps sit in the band above it, the room the 40:24 scope leaves */
#scope-wrap { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; padding: 8px; background: var(--bg); }
#band { position: absolute; top: 0; left: 0; right: 0; padding: 6px 12px 4px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
/* phones only: the whole sector fitted to the width, or a readable mile that pans */
#btn-zoom { display: none; margin-left: auto; padding: 2px 8px; font-size: 11px; letter-spacing: .08em; pointer-events: auto; }
#btn-zoom[aria-pressed="true"] { color: var(--bg); background: var(--accent); border-color: var(--accent); font-weight: 600; }
#radio { font-size: 13px; line-height: 1.45; min-height: 38px; }
#radio .ctl { color: var(--accent); }
#radio .pilot { color: var(--text); }
#radio .pilot.em { color: var(--warn); }
#radio .who { display: inline-block; width: 4ch; color: var(--dim); font-size: 11px; }
#lamps { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
#lamps-row { display: flex; gap: 8px; align-items: start; }
/* an unlit lamp is the cabinet's furniture: there, readable, and quiet, so
   the one that lights is the only thing in the row */
.lamp { font-size: 11px; letter-spacing: .08em; padding: 2px 6px; border: 1px solid var(--line); border-radius: 2px; color: var(--dim); background: var(--bg); transition: color .15s, border-color .15s, background .15s; }
.lamp.lit { color: var(--bg); background: var(--danger); border-color: var(--danger); font-weight: 600; animation: lamp .5s steps(2) infinite; }
.lamp.lit.amber { background: var(--warn); border-color: var(--warn); }
@keyframes lamp { 50% { opacity: .55; } }
#scope { display: block; background: var(--scope); border: 1px solid var(--line); border-radius: 2px; touch-action: none; max-width: 100%; max-height: 100%; }
/* the banner: an instant replay's, at the scope's foot, clear of the radio;
   a pause's, centred on the scope, which dims under it */
#banner { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 6px 14px; background: rgba(5,7,15,.85); border: 1px solid var(--lit); color: var(--text); letter-spacing: .2em; font-size: 12px; pointer-events: none; display: none; white-space: nowrap; }
#banner.on { display: block; }
#banner.pause { bottom: auto; transform: translate(-50%, -50%); padding: 12px 22px; font-size: 18px; font-weight: 600; text-align: center; background: rgba(5,7,15,.92); }
#banner.pause small { display: block; margin-top: 4px; font-size: 11px; font-weight: 400; letter-spacing: .08em; color: var(--ink); }
#scope { transition: filter .2s; }
#scope-wrap.paused #scope { filter: brightness(.45) saturate(.5); }
@media (prefers-reduced-motion: reduce) { #scope { transition: none; } }
/* the two notes over the scope: a career-ending error, and the coach on a
   first shift */
#notice, #coach { position: absolute; left: 50%; transform: translateX(-50%); max-width: min(560px, calc(100% - 32px)); padding: 8px 12px; font-size: 12px; line-height: 1.5; background: rgba(5,7,15,.92); border-radius: 2px; }
#notice { bottom: 20px; border: 1px solid var(--danger); color: var(--text); white-space: nowrap; }
#notice b { color: var(--danger); }
#notice button { padding: 2px 8px; font-size: 12px; margin-left: 2px; border-color: var(--danger); }
#coach { bottom: 20px; border: 1px solid var(--accent); color: var(--text); display: flex; gap: 10px; align-items: start; }
#coach kbd { color: var(--accent); border-color: var(--lit); }
#coach button { padding: 0 6px; font-size: 16px; line-height: 1.2; }
#notice[hidden], #coach[hidden] { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#right { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); background: var(--panel); }
#strips { flex: 1; min-height: 80px; overflow-y: auto; padding: 6px; }
#strips h3, #panel h3 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); font-weight: 600; padding: 2px 4px 6px; }
.strip { display: grid; grid-template-columns: 34px 1fr auto; gap: 3px 10px; align-items: center; padding: 8px 10px; margin-bottom: 5px; border: 1px solid var(--line); border-radius: 2px; background: var(--bg); cursor: pointer; font-size: 15px; }
.strip:hover { border-color: var(--lit); }
.strip:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.strip.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.strip.warn { border-color: var(--warn); }
.strip.pending { opacity: .65; cursor: default; }
.strip .id { font-size: 26px; font-weight: 700; color: var(--accent); grid-row: span 2; text-align: center; }
.strip.puma .id { color: var(--violet); }
.strip .id .hot { display: block; font-size: 12px; font-weight: 700; color: var(--bg); background: var(--text); border-radius: 2px; line-height: 16px; margin: 2px auto 0; width: 20px; }
#panel .who .hotkey { font-size: 10px; color: var(--dim); white-space: nowrap; }
.strip .call { color: var(--text); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip .route { color: var(--ink); font-size: 13px; }
.strip .alt { text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
.strip .st { text-align: right; font-size: 12px; letter-spacing: .06em; color: var(--dim); }
.strip .st.warn { color: var(--warn); font-weight: 600; }
.strip .st.good { color: var(--good); }
.strip .st.ready { color: var(--accent); }
.strip .st.bad { color: var(--danger); font-weight: 600; }
.strip.conf { border-color: var(--danger); }
.strip.em .call { color: var(--warn); }

#panel { border-top: 1px solid var(--line); padding: 8px; }
#panel .sel-none { color: var(--dim); font-size: 12px; padding: 6px 4px 10px; line-height: 1.5; }
/* the panel's rows keep their height: a longer status or callsign is cut,
   never wrapped, so the board above does not jump as the shift goes on */
#panel .who { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; padding: 0 4px 4px; }
#panel .who b { font-size: 15px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#panel .who span { color: var(--ink); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#panel .who .hotkey { color: var(--dim); font-size: 10px; text-align: right; }
#panel .who .route { grid-column: 1 / -1; }
#panel .now { display: flex; gap: 12px; padding: 0 4px 8px; font-size: 11px; color: var(--ink); white-space: nowrap; overflow: hidden; }
#panel .now b { color: var(--text); font-weight: 600; }
#panel .now .fuel.low { color: var(--warn); }
/* one line, always there, so the panel never jumps: what the command being
   set up will do that the player may not mean */
#panel .tip { min-height: 18px; padding: 0 4px 6px; font-size: 12px; line-height: 1.4; color: var(--warn); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmd { display: grid; grid-template-columns: auto auto 1fr; gap: 8px; align-items: start; }
.compass { display: grid; grid-template-columns: repeat(3, 40px); grid-template-rows: repeat(3, 40px); gap: 3px; }
.compass button { padding: 0; font-size: 12px; min-height: 0; line-height: 1.1; font-variant-numeric: tabular-nums; }
.compass button small { display: block; font-size: 9px; letter-spacing: .06em; color: var(--dim); }
.compass button.on small { color: rgba(5,7,15,.7); }
.compass .mid { display: grid; place-items: center; font-size: 11px; color: var(--accent); border: 1px solid var(--line); border-radius: 2px; background: var(--bg); line-height: 1.2; text-align: center; }
/* the heights, one column top-down like the bars under a plane, so up is
   up on the keys, on the glyph and here */
.alts { display: grid; grid-template-columns: 58px; gap: 3px; }
.alts button { padding: 0; height: 32px; font-size: 12px; font-variant-numeric: tabular-nums; }
.alts button[data-alt="0"] { color: var(--good); }
.alts button[data-alt="0"].on, .alts button[data-alt="0"].on:hover:not(:disabled) { color: var(--bg); background: var(--good); border-color: var(--good); }
.acts { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.acts button { font-size: 11px; padding: 6px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acts button.primary { color: var(--bg); background: var(--accent); border-color: var(--accent); font-weight: 600; height: 40px; }
.acts button.primary:hover:not(:disabled) { background: #8af6ff; border-color: #8af6ff; }
.acts button.primary kbd { color: var(--bg); border-color: rgba(5,7,15,.35); }
#log { height: 100px; overflow-y: auto; border-top: 1px solid var(--line); padding: 6px 10px; font-size: 12px; line-height: 1.5; color: var(--dim); }
#log .ctl { color: var(--accent); opacity: .8; }
#log .alarm { color: var(--danger); }
#log .sys { color: var(--ink); }
#log .pilot { color: var(--ink); }

/* ---- the title screen (greykit.games canon: the @gk-title script) and
   the scene behind it, shown only while the title is up ---- */
#title { position: fixed; inset: 0; z-index: 90; overflow-y: auto; }
#title[hidden] { display: none !important; }
body.on-title #game { visibility: hidden; }
.scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; display: none;
  background: radial-gradient(ellipse at 50% 60%, #0a1628 0%, #06101c 40%, #05070f 75%); }
body.on-title .scene { display: block; }
.scene svg, .scene canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
@keyframes sweep { to { transform: rotate(360deg); } }
.scene .sweep { transform-origin: 600px 400px; animation: sweep 6s linear infinite; }
@media (prefers-reduced-motion: reduce) { .scene .sweep { animation: none; } }

/* sheets: Settings, Help, the shift report, over the game or the title (which sits at 90) */
body > .gk-sheet { z-index: 100; }   /* the canon block injects its own .gk-sheet after this; body > outranks it */
.gk-sheet .gk-body .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 10px; }
.gk-sheet .gk-body .row button { font-size: 12px; }
.gk-sheet .gk-body .row button.on { color: var(--bg); background: var(--accent); border-color: var(--accent); font-weight: 600; }
.gk-sheet .gk-head button[data-x] { padding: 2px 8px; font-size: 16px; line-height: 1; }
.gk-sheet .gk-tabs button[aria-selected="true"] { border-color: var(--accent); color: var(--accent); }
.report { display: grid; grid-template-columns: auto 1fr; gap: 3px 16px; margin: 0 0 12px; }
.report .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--text); font-weight: 600; }
.report .bad { color: var(--danger); }
.report .good { color: var(--good); }
.verdict { font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 0 0 4px; }
.verdict.bad { color: var(--danger); }
.verdict.up { font-size: 22px; color: var(--good); letter-spacing: .16em; }
.verdict.bad.out { font-size: 20px; }
.why { color: var(--ink); margin: 0 0 14px; }
/* the shift's incidents: when, who, what, and a replay from a minute before */
.incidents { margin: 0 0 14px; border-top: 1px solid var(--line); }
.incidents h3 { margin: 10px 0 6px; }
.incident { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 12px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.incident time { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12px; }
.gk-sheet .gk-body .incident b { color: var(--danger); font-weight: 600; letter-spacing: .04em; }
.incident span { grid-column: 2; color: var(--ink); font-size: 12px; }
.incident button { grid-row: span 2; font-size: 12px; padding: 4px 10px; }
/* Help's drawing of a plane on the scope, on the scope's own ground */
.glyph-key { display: flex; flex-wrap: wrap; gap: 8px 24px; margin: 4px 0 6px; padding: 10px 12px; background: var(--scope); border: 1px solid var(--line); border-radius: 2px; }
.glyph-key svg { flex: 1 1 280px; max-width: 340px; height: auto; }
.row.quiet { margin-top: 6px; }
.gk-sheet .gk-body .row button.go { color: var(--bg); background: var(--accent); border-color: var(--accent); font-weight: 600; }
@media (hover: hover) { .gk-sheet .gk-body .row button.go:hover { background: #8af6ff; border-color: #8af6ff; } }
.row.quiet button { color: var(--dim); }
.gk-title .gk-sub { margin: 10px 0 0; font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: var(--dim); text-align: center; padding-left: .3em; }
.facility button b .rec { color: var(--good); font-weight: 400; font-size: 11px; margin-left: 6px; }
.facility { display: grid; grid-template-columns: 1fr; gap: 6px; margin: 0 0 10px; }
.facility button { text-align: left; display: flex; gap: 10px; align-items: baseline; padding: 8px 10px; }
.facility button b { flex: 0 0 21ch; color: var(--text); }
.facility button span { color: var(--dim); font-size: 11px; }
.facility button:disabled { opacity: .55; }
.facility button:disabled span { color: var(--dim); }
.ladder td { padding: 2px 10px 2px 0; }
.ladder td.me { color: var(--accent); font-weight: 600; }
.keymap { display: block; width: 100%; max-width: 400px; height: auto; margin: 2px auto 12px; font-family: var(--font-mono); font-size: 12px; }
.keymap .k rect { fill: var(--panel2); stroke: var(--line); }
.keymap .k text { fill: var(--dim); text-anchor: middle; dominant-baseline: central; opacity: .6; }
.keymap .k.on rect { stroke: var(--accent); }
.keymap .k.on text { fill: var(--text); font-weight: 600; opacity: 1; }
.keymap .leads polyline { fill: none; stroke: var(--lit); }
.keymap .leads circle { fill: var(--accent); }
.keymap .leads text { fill: var(--ink); dominant-baseline: central; }
/* a drawer in a help sheet: shut, it is one line in the h3's voice */
.gk-sheet .drawer { border-top: 1px solid var(--line); padding-top: 10px; }
.gk-sheet .drawer summary { cursor: pointer; list-style: none; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
.gk-sheet .drawer summary::-webkit-details-marker { display: none; }
.gk-sheet .drawer summary::before { content: "▸"; display: inline-block; width: 1.4em; transition: transform .15s; }
.gk-sheet .drawer[open] summary::before { transform: rotate(90deg); }
.gk-sheet .drawer summary:hover, .gk-sheet .drawer summary:focus-visible { color: var(--text); outline: none; }
.gk-sheet .drawer summary:focus-visible { box-shadow: 0 0 0 1px var(--accent); }
.gk-sheet .drawer[open] summary { margin-bottom: 4px; }

/* ---- phones: the band goes back into the flow above the scope, and the
   scope keeps a readable mile (14px) and pans sideways when the screen is
   narrower than that ---- */
@media (max-width: 860px) {
  #main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; overflow-y: auto; }
  #left { min-height: 0; }
  /* place-items back to normal: browsers that align blocks would centre the
     zoomed scope and leave its left edge where scrolling cannot reach */
  #scope-wrap { padding: 4px; min-height: 0; display: block; place-items: normal; overflow-x: auto; touch-action: pan-x pan-y; scrollbar-width: thin; scrollbar-color: var(--lit) transparent; }
  #scope-wrap::-webkit-scrollbar { height: 4px; }
  #scope-wrap::-webkit-scrollbar-thumb { background: var(--lit); border-radius: 2px; }
  #btn-zoom { display: inline-block; min-height: 32px; padding: 4px 12px; }
  #hud .btns button { min-height: 36px; }
  /* the lamps, one line, only those lit: the row keeps its height (ZOOM is
     in it), so the scope never moves when one comes on */
  #lamps-row { min-height: 32px; align-items: center; }
  #lamps { flex-wrap: nowrap; overflow: hidden; }
  .lamp:not(.lit) { display: none; }
  /* a plane selected: the board and the log step aside, so the whole
     command panel sits under the scope; Cancel brings them back */
  #game.has-sel #strips, #game.has-sel #log { display: none; }
  #band { position: sticky; left: 0; width: 100%; padding: 4px 8px; pointer-events: auto; }
  #radio { min-height: 0; font-size: 12px; }
  #scope { max-width: none; max-height: none; touch-action: pan-x pan-y; }
  #right { border-left: 0; border-top: 1px solid var(--line); }
  #strips { max-height: 220px; }
  #log { height: 90px; }
  #hud { gap: 6px 10px; padding: 6px 8px; }
  #hud .where { display: none; }
  #hud .btns { margin-left: auto; }
  .lamp { padding: 2px 5px; }
  .compass { grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 46px); }
  /* the heights two abreast, still reading top-down, so the whole panel
     fits under a zoomed scope */
  .alts { grid-template-columns: repeat(2, 56px); }
  .alts button { height: 44px; }
  #notice, #coach { position: sticky; left: 8px; transform: none; max-width: none; margin: 6px 4px 0; }
}
/* without a keyboard the key hints go, whole phrases at a time, so what is
   left still reads as a sentence; .tp is the touch wording in their place */
.tp { display: none; }
@media (pointer: coarse) { .acts button { padding: 9px 8px; } .kb, kbd.hint, #title .gk-menu kbd { display: none; } .tp { display: inline; } }
@media (prefers-reduced-motion: reduce) { .lamp.lit { animation: none; } }
</style>
</head>

const TITLE_CSS = `
/* ---- scrollbars, page-wide: a thin steel thumb on whatever ground it
   crosses, lit on hover. scrollbar-color covers Firefox and current
   Chromium; the -webkit- rules are for Safari, which ignores it. ---- */
*{scrollbar-width:thin;scrollbar-color:#2a3a5e transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:#2a3a5e;border:2px solid transparent;background-clip:padding-box;border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#47609c;background-clip:padding-box}

/* ---- boot ---- */
/* above anything a game layers its own screens with */
.gk-boot{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:var(--bg);
  --S:120px;--d:calc(var(--S) * .275);transition:opacity .35s ease}
.gk-boot.gk-out{opacity:0;pointer-events:none}
.gk-boot .gk-bar{position:absolute;top:0;left:0;height:2px;width:100%;background:var(--accent);
  box-shadow:0 0 12px var(--accent);transform-origin:0 50%;transform:scaleX(0);
  animation:gk-bar 1.8s cubic-bezier(.22,1,.36,1) .1s forwards}
.gk-boot.gk-ready .gk-bar{animation:gk-bar-end .3s ease-out forwards}
/* the whole face is the mark beside its mirror; the frame edge cuts the
   right half away as the face slides, and the left half -- the mark flipped,
   as greykit.com shows it -- is what stays, centred */
.gk-boot .gk-face{position:relative;width:calc(var(--S) * 2);height:var(--S);opacity:0;
  clip-path:inset(-40% 36.25% -40% -40%);animation:gk-show .2s ease-out .05s forwards}
.gk-boot .gk-slide{position:absolute;inset:0;transform:translateX(calc(var(--d) * -1));
  animation:gk-slide .6s cubic-bezier(.65,0,.35,1) .5s forwards}
.gk-boot .gk-lh,.gk-boot .gk-rh{position:absolute;top:0;width:var(--S);height:var(--S)}
/* the halves overlap by 2px, the left on top: two images laid edge to edge
   are anti-aliased edge by edge, and some browsers (Brave) leave a hairline
   of background between them */
.gk-boot .gk-lh{left:0;z-index:1}
.gk-boot .gk-rh{left:calc(var(--S) - 2px)}
.gk-boot .gk-pulse{width:100%;height:100%;position:relative;transform-origin:100% 50%;animation:gk-pulse .7s ease-in-out 1.15s}
.gk-boot .gk-face img{display:block;width:100%;height:100%;filter:invert(1) brightness(.72)}
.gk-boot .gk-pulse img{animation:gk-glow .7s ease-in-out 1.15s}
.gk-boot .gk-lh img,.gk-boot .gk-glint{transform:scaleX(-1)}
.gk-boot .gk-glint{position:absolute;inset:0;opacity:0;
  background:linear-gradient(110deg,transparent 38%,rgba(255,255,255,.95) 50%,transparent 62%) no-repeat;
  background-size:300% 100%;background-position:120% 0;
  -webkit-mask:url(${MARK}) center/100% 100% no-repeat;mask:url(${MARK}) center/100% 100% no-repeat;
  animation:gk-glint .65s ease-in-out 1.2s}
.gk-boot.gk-done .gk-face{animation:gk-out .3s ease-in forwards}
.gk-boot .gk-log{position:absolute;left:24px;bottom:22px;font-size:12px;color:var(--dim);line-height:1.7}
.gk-boot .gk-log div{white-space:nowrap}
.gk-boot .gk-log b{color:var(--accent);font-weight:400}
.gk-boot .gk-log .gk-ok{color:var(--good)}
.gk-boot .gk-skip{position:absolute;right:24px;bottom:22px;font-size:11px;color:var(--dim);opacity:0;animation:gk-show .3s .4s forwards}
.gk-boot .gk-scan{position:absolute;left:0;right:0;top:0;height:1px;background:var(--accent);
  box-shadow:0 0 16px 2px rgba(84,242,255,.6);opacity:0}
.gk-boot.gk-ready .gk-scan{animation:gk-scan .5s cubic-bezier(.5,0,.6,1) forwards}
@keyframes gk-bar{0%{transform:scaleX(0)}55%{transform:scaleX(.72)}100%{transform:scaleX(.92)}}
@keyframes gk-bar-end{from{transform:scaleX(.92)}to{transform:scaleX(1);opacity:0}}
@keyframes gk-show{to{opacity:1}}
@keyframes gk-out{from{opacity:1}to{opacity:0}}
@keyframes gk-slide{to{transform:translateX(var(--d))}}
@keyframes gk-pulse{0%,50%,100%{transform:scale(1)}25%{transform:scale(1.07)}75%{transform:scale(1.04)}}
@keyframes gk-glow{0%,50%,100%{filter:invert(1) brightness(.72)}
  25%{filter:invert(1) brightness(.95) drop-shadow(0 0 14px rgba(84,242,255,.55))}
  75%{filter:invert(1) brightness(.85) drop-shadow(0 0 8px rgba(84,242,255,.4))}}
@keyframes gk-glint{0%{opacity:1;background-position:120% 0}100%{opacity:1;background-position:-20% 0}}
@keyframes gk-scan{0%{top:0;opacity:1}100%{top:100%;opacity:.2}}

/* ---- title ---- */
.gk-title{position:relative;min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:56px 16px}
.gk-title>.scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:linear-gradient(#05070f 0%,#070b17 40%,#0c1020 68%,#181622 88%,#231a17 100%)}
.gk-title>.scene svg{display:block;width:100%;height:100%}
/* a shade at the top for the title and menu, and at the foot for the credit */
.gk-title>.gk-shade{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(rgba(5,7,15,.82) 0%,rgba(5,7,15,.55) 38%,rgba(5,7,15,0) 72%),
    linear-gradient(transparent calc(100% - 90px),rgba(5,7,15,.85))}
.gk-title>main{position:relative;z-index:1}
.gk-title.gk-rise>main{animation:gk-rise .5s cubic-bezier(.22,1,.36,1) both}
@keyframes gk-rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* the menu sits in the middle of the screen, and the name above it: three
   rows, the outer two sharing what is left over */
.gk-title main{flex:1;width:100%;display:grid;grid-template-rows:1fr auto 1fr;justify-items:center}
.gk-title .gk-name{align-self:end;display:flex;flex-direction:column;align-items:center;width:100%}
.gk-title h1{margin:6px 0 0;font-size:clamp(26px,6vw,42px);font-weight:600;letter-spacing:.24em;padding-left:.24em;text-transform:uppercase;
  text-align:center;color:var(--accent);text-shadow:0 0 22px rgba(84,242,255,.35);min-height:1.2em}
.gk-title .gk-rule{width:min(320px,80vw);height:1px;margin:26px 0 22px;
  background:linear-gradient(90deg,transparent,var(--lit),transparent)}
.gk-menu{display:flex;flex-direction:column;gap:8px;width:min(340px,100%)}
.gk-menu .gk-gap{height:6px}
.gk-menu button{display:flex;align-items:center;gap:12px;width:100%;min-height:42px;padding:0 14px;
  font-family:inherit;font-size:14px;letter-spacing:.08em;text-transform:uppercase;text-align:left;
  color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:2px;
  transition:border-color .15s,background .15s,color .15s}
.gk-menu button:hover:not(:disabled){border-color:var(--lit);background:var(--panel2)}
.gk-menu button:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.gk-menu .gk-lbl{flex:none;white-space:nowrap}
.gk-menu .gk-meta{flex:1;min-width:0;text-align:right;font-size:11px;letter-spacing:0;text-transform:none;
  color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gk-menu kbd,.gk-sheet kbd{font:inherit;font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:2px;
  padding:0 4px;min-width:18px;text-align:center;display:inline-block;letter-spacing:0}
.gk-menu button.gk-primary{color:var(--bg);background:var(--accent);border-color:var(--accent);font-weight:600}
.gk-menu button.gk-primary:hover:not(:disabled){background:#8af6ff;border-color:#8af6ff}
.gk-menu button.gk-primary kbd{color:var(--bg);border-color:rgba(5,7,15,.35)}
.gk-menu button.gk-primary .gk-meta{color:rgba(5,7,15,.7)}
/* pinned to the foot, with the same room kept top and bottom, so the menu's
   middle is the screen's */
.gk-title>footer{position:absolute;z-index:1;left:16px;right:16px;bottom:20px;font-size:12px;color:var(--dim);text-align:center}
.gk-credit a{color:var(--steel)}

/* ---- settings, help and about, over the title ---- */
.gk-sheet{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(3,5,10,.9);padding:16px}
.gk-sheet .gk-box{width:min(640px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--lit);border-radius:2px}
.gk-sheet .gk-head{display:flex;align-items:center;gap:12px;padding:14px 18px 0}
.gk-sheet .gk-head h2{margin:0;flex:1;font-size:14px;letter-spacing:.2em;color:var(--accent)}
.gk-sheet .gk-tabs{display:flex;flex-wrap:wrap;gap:4px;padding:12px 18px 0}
.gk-sheet .gk-body{padding:14px 18px 18px;overflow-y:auto;color:var(--ink);line-height:1.6}
.gk-sheet .gk-body p{margin:0 0 10px}
.gk-sheet .gk-body b{color:var(--text);font-weight:600}
.gk-sheet .gk-body h3{margin:16px 0 6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}
.gk-sheet .gk-body h3:first-child{margin-top:0}
.gk-sheet .gk-body ol,.gk-sheet .gk-body ul{margin:0 0 10px;padding-left:20px}
.gk-sheet .gk-body table{border-collapse:collapse;margin:0 0 10px}
.gk-sheet .gk-body td{padding:3px 12px 3px 0;vertical-align:top}
.gk-sheet .gk-body a{color:var(--steel)}
.gk-sheet .gk-row{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px}
.gk-sheet .gk-note{color:var(--dim);font-size:12px}
`;

const reduced = () => typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;
const escHTML = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

/**
 * Run the boot over the page while the game loads.
 *   lines: what the log says straight away (strings), one every ~0.55s
 * Returns { finish(lines), cancel() }. finish() takes the lines to add once
 * loading is done, plays out the boot's minimum run, and resolves when the
 * boot starts to fade -- mount the title before calling it, so the fade
 * reveals it.
 */
function runBoot({ lines = [] } = {}) {
  if (reduced()) return { finish: async () => {}, cancel() {} };
  const el = document.createElement("div");
  el.className = "gk-boot";
  el.setAttribute("aria-hidden", "true");
  el.innerHTML = '<div class="gk-bar"></div><div class="gk-face"><div class="gk-slide">' +
    '<div class="gk-lh"><div class="gk-pulse"><img alt=""><div class="gk-glint"></div></div></div>' +
    '<div class="gk-rh"><img alt=""></div></div></div>' +
    '<div class="gk-log"></div><div class="gk-scan"></div><div class="gk-skip">any key to skip</div>';
  /* set, not written into the markup: asset checkers read every src attribute as a file path */
  el.querySelectorAll("img").forEach(img => { img.src = MARK; });
  document.body.appendChild(el);
  const log = el.querySelector(".gk-log");
  const t0 = performance.now();
  const timers = [];
  const say = html => { const d = document.createElement("div"); d.innerHTML = "&gt; " + html; log.appendChild(d); };
  lines.forEach((l, i) => timers.push(setTimeout(() => say(l), 150 + i * 550)));
  /* a key that skips the boot is spent on it: it never reaches the title underneath */
  let skipped = false, skip = () => {};
  const onSkip = ev => { ev.preventDefault(); ev.stopPropagation(); skipped = true; skip(); };
  window.addEventListener("keydown", onSkip, true);
  el.addEventListener("pointerdown", onSkip);
  const wait = ms => new Promise(r => { const t = setTimeout(r, ms); timers.push(t); skip = () => { clearTimeout(t); r(); }; });
  const off = () => { timers.forEach(clearTimeout); window.removeEventListener("keydown", onSkip, true); };
  return {
    async finish(more = []) {
      /* the rest of the log, then ready: never before the face has pulsed */
      const at = Math.max(150 + lines.length * 550, performance.now() - t0);
      for (const [i, l] of more.entries()) timers.push(setTimeout(() => say(l), Math.max(0, at + i * 300 - (performance.now() - t0))));
      const readyAt = Math.max(1850, at + more.length * 300);
      if (!skipped) await wait(readyAt - (performance.now() - t0));
      say('<span class="gk-ok">ready</span>');
      el.classList.add("gk-ready");
      el.classList.add("gk-done");
      if (!skipped) await wait(550);
      off();
      el.classList.add("gk-out");
      setTimeout(() => el.remove(), 400);
    },
    cancel() { off(); el.remove(); }
  };
}

/**
 * The title screen's markup, for a game that draws its own screens: the same
 * HTML mountTitle puts in. cfg is mountTitle's name, items and primary;
 * scene: true leaves a .scene for the game's backdrop, and a game whose
 * backdrop is already drawn behind its pages leaves it out.
 */
function titleHTML(cfg) {
  const items = cfg.items.filter(Boolean);
  return '<div class="gk-title">' + (cfg.scene ? '<div class="scene" aria-hidden="true"></div>' : "") + '<div class="gk-shade" aria-hidden="true"></div>' +
    '<main><div class="gk-name"><h1 aria-label="' + escHTML(cfg.name) + '">' + escHTML(cfg.name) + '</h1><div class="gk-rule"></div></div><nav class="gk-menu" aria-label="Main menu">' +
    items.map(it => it === "gap" ? '<div class="gk-gap"></div>' :
      '<button data-act="' + it.act + '"' + (it.act === cfg.primary ? ' class="gk-primary"' : "") + "><kbd>" + escHTML(it.key) + '</kbd><span class="gk-lbl">' +
      escHTML(it.label) + "</span>" + (it.meta ? '<span class="gk-meta">' + escHTML(it.meta) + "</span>" : "") + "</button>").join("") +
    '</nav></main><footer><span class="gk-credit">Built by <a href="https://greykit.com/" target="_blank" rel="noopener">greykit.com</a></span></footer></div>';
}

/* the name decodes out of noise once, as the screen arrives -- by the
 * clock, not by ticks, so a throttled background tab still ends on time */
function decodeTitle(h1, text) {
  if (reduced()) return;
  const glyphs = "▚▞▖▗▘▝#/\\<>=+", t0 = performance.now(), ms = 400;
  const t = setInterval(() => {
    const p = (performance.now() - t0) / ms;
    if (!h1.isConnected || p >= 1) { clearInterval(t); h1.textContent = text; return; }
    const done = Math.floor(text.length * p);
    h1.textContent = text.slice(0, done) + [...text.slice(done)].map(c => c === " " ? " " : glyphs[Math.random() * glyphs.length | 0]).join("");
  }, 28);
}

/* The title's stylesheet, once, for a game that does not build its own CSS
 * around TITLE_CSS. */
function injectTitleCSS() {
  if (!document.getElementById("gk-title-css")) document.head.insertAdjacentHTML("beforeend", '<style id="gk-title-css">' + TITLE_CSS + "</style>");
}

/* The boot log's first line: the page being reloaded, escaped. */
function bootReloadLine() {
  return "reload <b>" + escHTML(location.pathname.replace(/index\.html$/, "")) + "</b>";
}

/* The entrance: the menu rises, the name decodes, the default is focused.
 * t is the .gk-title (the page's, if left out); the name is read off the h1. */
function revealTitle(t = document.querySelector(".gk-title")) {
  if (!t) return;
  t.classList.add("gk-rise");
  const h1 = t.querySelector("h1");
  decodeTitle(h1, h1.getAttribute("aria-label"));
  const b = t.querySelector(".gk-primary") || t.querySelector(".gk-menu button");
  if (b) b.focus({ preventScroll: true });
}

/* The menu button a key presses: the one whose <kbd> shows that key, and the
 * ? item for h and / as well. Read off the menu itself, so a key and its
 * label cannot disagree. null when the key is not the menu's. */
function titleKeyButton(menu, key) {
  const k = key.length === 1 ? key.toLowerCase() : key;
  const bs = [...menu.querySelectorAll("button")], kbd = b => (b.querySelector("kbd") || {}).textContent || "";
  return bs.find(b => kbd(b).toLowerCase() === k) || ((k === "h" || k === "/") && bs.find(b => kbd(b) === "?")) || null;
}

/* ArrowDown / ArrowUp through the menu, wrapping. true when the key was one. */
function titleArrow(menu, ev) {
  if (ev.key !== "ArrowDown" && ev.key !== "ArrowUp") return false;
  const bs = [...menu.querySelectorAll("button")], i = bs.indexOf(document.activeElement);
  ev.preventDefault();
  bs[(i + (ev.key === "ArrowDown" ? 1 : -1) + bs.length) % bs.length].focus();
  return true;
}

/* A question or a notice in the title's sheet, from any screen of the game,
 * in place of window.confirm and window.alert (STANDARD.md §11): those are
 * silently answered "no", or never shown, where a page is embedded, and a
 * button that does nothing reads as broken. confirmSheet resolves true only
 * on the yes button; Cancel, Escape and the backdrop resolve false.
 * alertSheet resolves when it is dismissed. While one is up it has the keys:
 * Tab stays inside it and nothing reaches the game behind. Focus goes back
 * to whatever had it. */
function confirmSheet(question, yes, title = "Are you sure?") { return dialogSheet(title, question, yes, "Cancel"); }
function alertSheet(message, title = "Notice") { return dialogSheet(title, message, "OK", null); }
function dialogSheet(title, text, yes, no) {
  return new Promise(resolve => {
    const back = document.activeElement;
    const el = document.createElement("div");
    el.className = "gk-sheet";
    el.setAttribute("role", "alertdialog");
    el.setAttribute("aria-modal", "true");
    el.setAttribute("aria-label", title);
    el.innerHTML = '<div class="gk-box"><div class="gk-head"><h2>' + escHTML(title) + '</h2></div><div class="gk-body"><p>' + escHTML(text) +
      "</p><div class='gk-row'><button data-yes>" + escHTML(yes) + "</button>" + (no ? "<button data-no>" + escHTML(no) + "</button>" : "") + "</div></div></div>";
    const done = v => {
      document.removeEventListener("keydown", onKey, true);
      el.remove();
      if (back && back.isConnected && back.focus) back.focus({ preventScroll: true });
      resolve(v);
    };
    const onKey = ev => {
      if (ev.key === "Escape") { ev.preventDefault(); ev.stopPropagation(); done(false); return; }
      if (ev.key === "Tab") {
        const bs = [...el.querySelectorAll("button")], i = bs.indexOf(document.activeElement);
        ev.preventDefault();
        bs[(i + (ev.shiftKey ? -1 : 1) + bs.length) % bs.length].focus();
      }
      /* nothing reaches the game behind; Enter and Space still press the
         focused button, which is their default, not a listener's */
      ev.stopPropagation();
    };
    el.addEventListener("click", ev => {
      if (ev.target === el) return done(false);
      const b = ev.target.closest("button");
      if (b) done(b.hasAttribute("data-yes"));
    });
    document.addEventListener("keydown", onKey, true);
    document.body.appendChild(el);
    el.querySelector("[data-yes]").focus();
  });
}

/**
 * The title screen, into host.
 *   name      the game's name
 *   items     the menu, top to bottom: { act, label, key, meta? }, or "gap"
 *             before Settings / Help / About; anything falsy is left out
 *   primary   the act that is the default (lit, and focused)
 *   scene(el) draws the game's backdrop into el
 *   help      [[tab, html], ...]   about: html
 *   settings  { html(), onClick(button, sheet) }; sheet.confirm() as below
 *   onAct(act, ui) every other item; ui.confirm(question, yes) resolves true
 *             or false, asked in a sheet of this screen's own: window.confirm
 *             is silently answered "no" where a page is embedded, and a
 *             button that does nothing reads as broken
 * Returns { reveal(), unmount() }. reveal() runs the title's entrance; call it
 * as the boot fades (or at once, coming back from a game).
 */
function mountTitle(host, cfg) {
  const ctl = new AbortController();
  const sig = { signal: ctl.signal };
  host.innerHTML = titleHTML(cfg);
  const root = host.firstChild, menu = root.querySelector(".gk-menu");
  if (cfg.scene) cfg.scene(root.querySelector(".scene"));
  const focusPrimary = () => { const b = menu.querySelector(".gk-primary") || menu.querySelector("button"); if (b) b.focus({ preventScroll: true }); };

  let sheet = null;
  function openSheet(title, { tabs, html, onClick, refresh }) {
    closeSheet();
    const el = document.createElement("div");
    el.className = "gk-sheet";
    el.setAttribute("role", "dialog");
    el.setAttribute("aria-modal", "true");
    el.setAttribute("aria-label", title);
    let tab = 0;
    const draw = () => {
      el.innerHTML = '<div class="gk-box"><div class="gk-head"><h2>' + escHTML(title) + '</h2><button data-x aria-label="Close">&times;</button></div>' +
        (tabs ? '<div class="gk-tabs" role="tablist">' + tabs.map(([t], i) => '<button role="tab" data-tab="' + i + '" aria-selected="' + (i === tab) +
          '" aria-pressed="' + (i === tab) + '">' + escHTML(t) + "</button>").join("") + "</div>" : "") +
        '<div class="gk-body">' + (tabs ? tabs[tab][1] : html()) + "</div></div>";
    };
    draw();
    const api = { refresh: () => { draw(); }, close: () => closeSheet(), confirm: (q, yes) => ask(q, yes) };
    el.addEventListener("click", ev => {
      if (ev.target === el) return closeSheet();
      const b = ev.target.closest("button");
      if (!b) return;
      if (b.hasAttribute("data-x")) return closeSheet();
      if (b.dataset.tab !== undefined) { tab = +b.dataset.tab; draw(); el.querySelector('[data-tab="' + tab + '"]').focus(); return; }
      if (onClick) onClick(b, api);
    });
    document.body.appendChild(el);
    sheet = el;
    (el.querySelector('[role="tab"][aria-selected="true"]') || el.querySelector("[data-x]")).focus();
  }
  function closeSheet() {
    if (!sheet) return;
    sheet.remove(); sheet = null;
    const f = onSheetClose; onSheetClose = null;
    if (f) f();
    focusPrimary();
  }

  /** A yes-or-no question in a sheet; resolves true only on the yes button. */
  function ask(question, yes) {
    return new Promise(resolve => {
      let answered = false;
      const done = v => { if (answered) return; answered = true; resolve(v); };
      openSheet("Are you sure?", {
        html: () => "<p>" + escHTML(question) + "</p><div class='gk-row'><button data-yes>" + escHTML(yes) + "</button><button data-no>Cancel</button></div>",
        onClick: (b, s) => { if (b.hasAttribute("data-yes")) { done(true); s.close(); } else if (b.hasAttribute("data-no")) s.close(); }
      });
      sheet.querySelector("[data-yes]").focus();
      onSheetClose = () => done(false);
    });
  }
  let onSheetClose = null;

  function act(a) {
    if (a === "help" && cfg.help) return openSheet("Help", { tabs: cfg.help });
    if (a === "about" && cfg.about) return openSheet("About", { html: () => cfg.about });
    if (a === "settings" && cfg.settings) return openSheet("Settings", cfg.settings);
    cfg.onAct(a, { confirm: ask });
  }
  menu.addEventListener("click", ev => { const b = ev.target.closest("button"); if (b) act(b.dataset.act); }, sig);
  document.addEventListener("keydown", ev => {
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    if (sheet) { if (ev.key === "Escape") { ev.preventDefault(); closeSheet(); } return; }
    if (ev.target.closest && ev.target.closest("input,select,textarea")) return;
    const hit = titleKeyButton(menu, ev.key);
    if (hit) { ev.preventDefault(); act(hit.dataset.act); return; }
    titleArrow(menu, ev);
  }, sig);

  return {
    reveal() { revealTitle(root); },
    unmount() { ctl.abort(); closeSheet(); }
  };
}

/* mulberry32: a small seeded generator, so a seed and the command log replay

  let sum = 0; for (const k of keys) sum += weights[k];
  let r = rnd(S) * sum;
  for (const k of keys) { r -= weights[k]; if (r < 0) return k; }
  return keys[keys.length - 1];
}

/* heading from (x,y) toward (tx,ty), snapped to eight */
function bearing(x, y, tx, ty) {
  const a = Math.atan2(tx - x, -(ty - y));            /* 0 north, clockwise */
  return ((Math.round(a / (Math.PI / 4)) % 8) + 8) % 8;
}
/* the short way round, -3..4: a 180 is +4, so it goes right unless told */
function turnDelta(from, to) { const d = (((to - from) % 8) + 8) % 8; return d > 4 ? d - 8 : d; }
const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
const cheb = (a, b) => Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y));
function vorOf(ap) { return { x: ap.x - DIRS[ap.rwy][0] * VOR_D, y: ap.y - DIRS[ap.rwy][1] * VOR_D }; }
function iafOf(ap) { return { x: ap.x - DIRS[ap.rwy][0] * (VOR_D + IAF_D), y: ap.y - DIRS[ap.rwy][1] * (VOR_D + IAF_D) }; }
function inside(sec, x, y) { return x >= 0 && y >= 0 && x < sec.W && y < sec.H; }

/* The heading to take now to reach the goal dot on the goal heading, turning
 * 45 degrees a dot: a breadth-first search over (x, y, heading), which is how
 * a pilot flying to a fix gets there instead of orbiting it. -1 if there is
 * no way. Keeps out of a restricted zone and off the fixes, which are exits;
 * terrain and weather are the controller's problem. */
function navHeading(sec, p, goal) {
  const W = sec.W, key = (x, y, h) => ((y * W + x) << 3) | h;
  if (!sec._fixSet) sec._fixSet = new Set(sec.fixes.map(f => f.x + "," + f.y));
  const prev = new Int32Array(W * sec.H * 8).fill(-1);
  const start = key(p.x, p.y, p.h);
  prev[start] = start;
  const q = [start];
  for (let qi = 0; qi < q.length; qi++) {
    const s = q[qi], h = s & 7, x = (s >> 3) % W, y = (s >> 3) / W | 0;
    if (typeof goal === "function" ? goal(x, y, h) : x === goal.x && y === goal.y && h === goal.h) {
      let cur = s;
      while (prev[cur] !== start) cur = prev[cur];
      return cur & 7;
    }
    for (const dh of [0, 1, 7]) {
      const nh = (h + dh) & 7, nx = x + DIRS[nh][0], ny = y + DIRS[nh][1];
      if (!inside(sec, nx, ny) || (sec.restricted && sec.restricted(nx, ny)) || sec._fixSet.has(nx + "," + ny)) continue;
      const ns = key(nx, ny, nh);
      if (prev[ns] !== -1) continue;
      prev[ns] = s; q.push(ns);
    }
  }
  return -1;
}
/* on the inbound leg: at the IAF or between it and the VOR, on the runway heading */
function onInbound(p, ap) {
  if (p.h !== ap.rwy) return false;
  for (let k = VOR_D; k <= VOR_D + IAF_D; k++) if (p.x === ap.x - DIRS[ap.rwy][0] * k && p.y === ap.y - DIRS[ap.rwy][1] * k) return true;
  return false;
}
/* miles out on the runway's extended centerline, on the approach side; -1 off it */
function finalDist(ap, x, y) {
  const [dx, dy] = DIRS[ap.rwy], d = dx ? (ap.x - x) / dx : (ap.y - y) / dy;
  return d >= 1 && x === ap.x - dx * d && y === ap.y - dy * d ? d : -1;
}
/* a dot a plane cleared to land can start down from: on the centerline,
 * on the runway heading, and far enough out to lose its height at 1,000 ft
 * a mile. Lower and further out it flies level until it meets that slope. */
function joinsFinal(ap, x, y, h, alt) { return h === ap.rwy && finalDist(ap, x, y) >= Math.max(alt, 2); }
/* how a plane joins the hold from wherever it is */
function joinNav(p, ap, apIdx) {
  const vor = vorOf(ap);
  if (p.x === vor.x && p.y === vor.y && p.h === ap.rwy) return "atvor";
  if (p.nav === "pattern" && p.landAp === apIdx) return "pattern";
  if (onInbound(p, ap)) return "vor";
  return "iaf";
}

/* the heading a plane enters on from a fix, toward tgt; one that would
 * leave the map at once is nudged inward */
function entryHeading(sec, f, tgt) {
  let h = bearing(f.x, f.y, tgt.x, tgt.y);
  for (let i = 0; i < 4 && !inside(sec, f.x + DIRS[h][0], f.y + DIRS[h][1]); i++) h = (h + 1) % 8;
  return h;
}

/* The traffic lanes drawn bright: the dots an arrival left alone flies from
 * each fix to each airport's IAF, flown with the arrival's own navigation,
 * so a lane is where a plane will go. Cosmetic. */
function lanes(sec) {
  const out = new Set();
  for (const ap of sec.airports) {
    const iaf = iafOf(ap), goal = { x: iaf.x, y: iaf.y, h: ap.rwy };
    for (const f of sec.fixes) {
      const p = { x: f.x, y: f.y, h: entryHeading(sec, f, iaf) };
      for (let i = 0; i < 120 && inside(sec, p.x, p.y); i++) {
        out.add(p.x + "," + p.y);
        if (p.x === iaf.x && p.y === iaf.y && p.h === ap.rwy) break;
        const nh = navHeading(sec, p, goal);
        if (nh < 0) break;
        p.h = nh; p.x += DIRS[nh][0]; p.y += DIRS[nh][1];
      }
    }
  }
  return out;
}

/* ---- a shift ---- */
function newShift({ sector, shift, rank = 1, seed = 1, practice = false }) {
  const sec = SECTORS[sector], sh = SHIFTS[shift];
  const S = {
    sector, shift, rank, seed, practice, rng: seed | 0,
    t: 0, end: sh.min * TPM, over: false,
    planes: [], next: 0, letter: 0, nums: {},
    DN: shift + 1 + sector + 1 + 3,          /* the original's traffic number */
    storm: null, stormAt: -1,
    conflictTicks: 0, delayTicks: 0, delayPuma: 0,
    done: [],                                /* every flight's outcome */
    log: [],                                 /* commands, for the replay */
    events: [],                              /* what happened this tick, for the UI */
    sel: null,
    hot: {},                                 /* the player's quick keys: digit -> plane letter */
  };
  /* thunderstorms: never on Trainee; Graveyard and Afternoon only at Denver;
   * about one shift in two. A storm thins the traffic: DN = max(8, 2DN/3). */
  const may = shift === 0 ? false : (shift <= 2 ? sec.storms === "always" : true);
  if (may && rnd(S) < 0.5) {
    S.stormAt = TPM * (2 + ri(S, Math.max(1, sh.min - 6)));
    S.DN = Math.max(8, Math.floor(S.DN * 2 / 3));
  }
  S.group = Math.floor(S.DN / 3) + 2;        /* planes the sector holds at once */
  S.gap = Math.max(3, Math.round(160 / S.DN / 3));   /* ticks between new flight plans */
  S.cap = S.group + 3;
  S.next = 2;                                /* the first strip at once; its plane a minute later */
  return S;
}

function nextLetter(S) {
  const used = new Set(S.planes.map(p => p.id));
  for (let i = 0; i < LETTERS.length; i++) {
    const L = LETTERS[(S.letter + i) % LETTERS.length];
    if (!used.has(L)) { S.letter = (S.letter + i + 1) % LETTERS.length; return L; }
  }
  return null;
}

function makeFlight(S) {
  const sec = SECTORS[S.sector];
  const id = nextLetter(S);
  if (!id) return null;
  /* the shift's first flight: on the air in 15 seconds, not a minute, so
   * the scope is never empty for long; on a Trainee shift it is an arrival,
   * the one kind that flies itself to the VOR and waits to be taught on */
  const first = !Object.keys(S.nums).length;
  const kind = first && S.shift === 0 ? "arr" : pick(S, sec.mix);
  let al;
  const r = rnd(S);
  if (sec.ssc && r < sec.ssc && kind !== "tra") al = "AF";
  else if (sec.light && r < sec.ssc + sec.light && kind !== "tra") al = "N";
  else al = pick(S, sec.airlines);
  const cls = AIRLINES[al].cls;
  /* where it is going and coming from */
  const ports = sec.airports.filter(a => cls === "ssc" ? a.ssc : cls === "light" ? true : !a.lightOnly);
  const pw = {}; ports.forEach(a => { pw[sec.airports.indexOf(a)] = cls === "light" && a.lightOnly ? a.w * 4 : a.w; });
  const fixes = sec.fixes.filter(f => cls === "ssc" ? f.n === "PARIS" : f.n !== "PARIS");
  if (!fixes.length || !ports.length) return null;
  const ap = +pick(S, pw);
  let from, to, fromFix = null, toFix = null, toAp = null;
  if (kind === "arr") { fromFix = fixes[ri(S, fixes.length)]; toAp = ap; from = fromFix.n; to = sec.airports[ap].code; }
  else if (kind === "dep") { toFix = fixes[ri(S, fixes.length)]; from = sec.airports[ap].code; to = toFix.n; }
  else {
    fromFix = fixes[ri(S, fixes.length)];
    const others = fixes.filter(f => f !== fromFix && dist2(f, fromFix) > 100);
    toFix = others[ri(S, others.length)] || fixes.find(f => f !== fromFix);
    from = fromFix.n; to = toFix.n;
  }
  let num;
  do { num = al === "N" ? 100 + ri(S, 900) : 10 + ri(S, 890); } while (S.nums[al + num]);
  S.nums[al + num] = 1;
  const p = {
    id, al, num, cls, kind, from, to, toAp, landAp: null, apIdx: null,
    x: 0, y: 0, px: 0, py: 0, h: 0, alt: 5, th: null, talt: null, tdir: 0,
    mode: "pending", holdDir: 1, nav: null, pat: 0, period: CLASSES[cls].period, phase: 0,
    posted: S.t, enter: S.t + (first ? 2 : TPM), fuel: (kind === "arr" ? 15 : 60) * TPM, emergency: false,
    budget: 0, delay: 0, cmds: 0, conf: -99, next: null,
  };
  if (fromFix) {
    p.x = p.px = fromFix.x; p.y = p.py = fromFix.y;
    const tgt = kind === "arr" ? iafOf(sec.airports[ap]) : toFix;
    p.h = entryHeading(sec, fromFix, tgt);
    if (kind === "arr") p.nav = "iaf";
    const d = cheb(p, kind === "arr" ? sec.airports[ap] : toFix);
    p.budget = Math.round(d * p.period * 1.6) + 3 * TPM;
  } else {
    const a = sec.airports[ap];
    p.x = p.px = a.x; p.y = p.py = a.y; p.h = a.rwy; p.alt = 0; p.apIdx = ap;
    p.budget = 2 * TPM;                 /* two minutes on the ground is free */
  }
  return p;
}

/* ---- commands: each goes in the log for the replay ---- */
function callsign(p) { return AIRLINES[p.al].name + " " + p.num; }
function shortCall(p) { return AIRLINES[p.al].code + p.num; }      /* DL101, PUM252: the tag on the scope */
function sayNum(n) { return String(n).split(""); }
function sayCall(p) { return [...AIRLINES[p.al].say, ...sayNum(p.num)]; }
function sayHdg(h) { return HDG[h].split(""); }
function sayAlt(a) { return a === 0 ? ["0"] : [String(a), "thousand"]; }
function altText(a) { return a === 0 ? "the field" : a + ",000"; }
function find(S, id) { return S.planes.find(p => p.id === id) || null; }
/* heard at any speed: a plane calling up on the frequency (true, a
   check-in), or a pilot with a problem ("urgent", ahead of the chatter) */
function radio(S, who, text, say, flag) {
  const e = { type: "radio", who, text, say };
  if (flag === true) e.checkin = true; else if (flag) e[flag] = true;
  S.events.push(e);
}
function alarm(S, lamp, text) { S.events.push({ type: "alarm", lamp, text }); }

/* A command is said and logged at once, but the pilot needs a moment to
 * take it in: it waits as p.next until ACK_S seconds after it was sent, and
 * takes hold at the first dot after that. c.at is when it was sent, in
 * ticks with the fraction (the UI's clock); a second command before then
 * simply replaces it. */
const ACK_S = 4;
const ACK = ACK_S / (60 / TPM);
function command(S, c) {
  const p = find(S, c.id);
  if (!p || S.over) return false;
  if (c.op === "status") {
    if (p.mode === "pending") return false;
    radio(S, "ctl", callsign(p) + ", say heading and altitude", [...sayCall(p), "say", "heading", "and", "altitude"]);
    radio(S, "pilot", "heading " + HDG[p.h] + ", " + altText(p.alt) + ", " + (p.emergency ? Math.ceil(p.fuel / TPM) + " minutes fuel, " : "") + callsign(p),
      ["heading", ...sayHdg(p.h), "altitude", ...sayAlt(p.alt), ...sayCall(p)]);
    S.log.push({ t: S.t, c });
    return true;
  }
  if (!sayCommand(S, p, c)) return false;
  p.next = { c, ready: (c.at != null ? c.at : S.t) + ACK };
  S.log.push({ t: S.t, c });
  return true;
}

/* the controller's words and the pilot's readback; false if the plane cannot take it */
function sayCommand(S, p, c) {
  const sec = SECTORS[S.sector];
  if (c.op === "vector") {
    if (p.mode === "pending") return false;
    if (p.mode === "final") { radio(S, "pilot", callsign(p) + ", unable, on final", [...sayCall(p), "unable"]); return false; }
    if (p.mode === "ground") {
      const ap = sec.airports[p.apIdx];
      /* a plane on short final: the departure waits, under the LANDING! lamp,
       * the original's name for it */
      if (S.planes.some(q => q !== p && q.mode === "final" && q.landAp === p.apIdx)) {
        alarm(S, "LANDING", "LANDING! " + ap.code + " runway in use");
        radio(S, "pilot", callsign(p) + ", holding short, traffic on final", [...sayCall(p), "unable"]);
        return false;
      }
      const alt = c.alt == null ? 5 : c.alt;
      radio(S, "ctl", callsign(p) + ", cleared for takeoff, fly heading " + HDG[c.h] + ", climb and maintain " + altText(alt),
        [...sayCall(p), "cleared", "for", "takeoff", "heading", ...sayHdg(c.h), "climb", "and", "maintain", ...sayAlt(alt)]);
      radio(S, "pilot", "rolling, heading " + HDG[c.h] + ", " + callsign(p), ["rolling", "heading", ...sayHdg(c.h), ...sayCall(p)]);
      return true;
    }
    const d = turnDelta(p.h, c.h), dir = c.dir || (d < 0 ? -1 : d > 0 ? 1 : 0);
    const turn = dir < 0 ? "turn left" : dir > 0 ? "turn right" : "fly";
    const vert = c.alt > p.alt ? "climb and maintain" : c.alt < p.alt ? "descend and maintain" : "maintain";
    radio(S, "ctl", callsign(p) + ", " + turn + " heading " + HDG[c.h] + ", " + vert + " " + altText(c.alt),
      [...sayCall(p), ...(dir < 0 ? ["turn", "left"] : dir > 0 ? ["turn", "right"] : []), "heading", ...sayHdg(c.h),
       ...(c.alt > p.alt ? ["climb", "and", "maintain"] : c.alt < p.alt ? ["descend", "and", "maintain"] : ["maintain"]), ...sayAlt(c.alt)]);
    radio(S, "pilot", (dir < 0 ? "turning left " : dir > 0 ? "turning right " : "") + "heading " + HDG[c.h] + ", " +
      (c.alt > p.alt ? "climbing " : c.alt < p.alt ? "descending " : "maintaining ") + altText(c.alt) + ", " + callsign(p),
      ["roger", ...(dir < 0 ? ["turning", "left"] : dir > 0 ? ["turning", "right"] : []), "heading", ...sayHdg(c.h),
       ...(c.alt > p.alt ? ["climbing", "to"] : c.alt < p.alt ? ["descending", "to"] : []), ...sayAlt(c.alt), ...sayCall(p)]);
    return true;
  }
  if (c.op === "hold") {
    if (p.mode !== "fly" && p.mode !== "hold" && p.mode !== "land") return false;
    const side = (c.dir || 1) > 0 ? "right" : "left";
    const lower = c.alt != null && c.alt !== p.alt;
    radio(S, "ctl", callsign(p) + ", hold " + side + " turns at the VOR" + (lower ? ", " + altText(c.alt) : ""),
      [...sayCall(p), "hold", side, "at", "the", "vor", ...(lower ? ["at", ...sayAlt(c.alt)] : [])]);
    radio(S, "pilot", "roger, holding at the VOR" + (lower ? ", " + altText(c.alt) : "") + ", " + callsign(p),
      ["roger", "holding", "at", "the", "vor", ...(lower ? sayAlt(c.alt) : []), ...sayCall(p)]);
    return true;
  }
  if (c.op === "land") {
    if (p.mode !== "fly" && p.mode !== "hold" && p.mode !== "land") return false;
    const ap = sec.airports[c.ap];
    if (!ap) return false;
    radio(S, "ctl", callsign(p) + ", cleared to land " + ap.name, [...sayCall(p), "cleared", "to", "land", "runway", ...sayHdg(ap.rwy)]);
    radio(S, "pilot", "roger, cleared to land, " + callsign(p), ["roger", "cleared", "to", "land", ...sayCall(p)]);
    return true;
  }
  return false;
}

/* the pilot does it: at a dot for a plane in the air, on the next tick for
 * one on the ground. False if it cannot be done now (it waits, or is moot) */
function applyCommand(S, p, c) {
  const sec = SECTORS[S.sector];
  if (c.op === "vector" && p.mode === "ground") {
    if (S.planes.some(q => q !== p && q.mode === "final" && q.landAp === p.apIdx)) return false;   /* still waiting for the runway */
    p.mode = "fly"; p.th = c.h; p.talt = c.alt == null ? 5 : c.alt; p.alt = 0; p.phase = 0; p.cmds++;
    p.climbout = true;                  /* down the runway first: see stepPlane */
    const d = turnDelta(p.h, c.h);
    p.tdir = c.dir || (d < 0 ? -1 : d > 0 ? 1 : 0);
    p.enter = S.t;
    p.budget = Math.round(cheb(p, sec.fixes.find(f => f.n === p.to)) * p.period * 1.6) + 3 * TPM;
    return true;
  }
  if (p.mode === "final" || p.mode === "ground" || p.mode === "pending") return true;              /* moot now */
  if (c.op === "vector") {
    const d = turnDelta(p.h, c.h);
    p.tdir = c.dir || (d < 0 ? -1 : d > 0 ? 1 : 0);
    p.th = c.h; p.talt = c.alt;
    p.mode = "fly"; p.nav = null; p.cmds++;
  } else if (c.op === "hold") {
    const apIdx = p.toAp != null ? p.toAp : 0, nav = joinNav(p, sec.airports[apIdx], apIdx);
    p.mode = "hold"; p.holdDir = c.dir || 1; p.th = null; p.cmds++; p.landAp = apIdx;
    if (nav === "atvor") { p.nav = "pattern"; p.pat = 0; } else p.nav = nav;
    if (c.alt != null) p.talt = c.alt;
    else if (p.talt === 0) p.talt = p.alt;              /* pulled off the approach: level off */
  } else if (c.op === "land") {
    /* the shortest way onto the centerline, wherever it is: not back round
     * by the IAF when it is already lined up or crossing the final */
    p.mode = "land"; p.landAp = c.ap; p.th = null; p.cmds++; p.nav = "join";
  }
  return true;
}

/* ---- the clock ---- */
/* tag: what went wrong, in a few words, for the mark the scope leaves where
 * it happened and the shift report's list of incidents */
function finish(S, p, outcome, lamp, text, tag) {
  p.mode = "done"; p.outcome = outcome;
  S.planes.splice(S.planes.indexOf(p), 1);
  S.done.push({ id: p.id, call: callsign(p), al: p.al, outcome, kind: p.kind, from: p.from, to: p.to, t: S.t, text: text || "", tag: tag || "", x: p.x, y: p.y });
  if (lamp) alarm(S, lamp, text);
  S.events.push({ type: "gone", id: p.id, outcome, call: callsign(p), short: shortCall(p), tag: tag || "", x: p.x, y: p.y });
  if (S.sel === p.id) S.sel = null;
}

function stepPlane(S, p) {
  const sec = SECTORS[S.sector];
  /* 0. a command taken in by now takes hold at this dot */
  if (p.next && S.t >= p.next.ready) { applyCommand(S, p, p.next.c); p.next = null; }
  /* 1. what it does at this dot: a turn, then altitude. A departure's first
   * dot is its climb-out: straight down the runway to 1,000 ft, whatever it
   * was told, because it is taking off and not hovering; the clearance's
   * turn and climb start from the dot after. */
  const climbout = p.climbout;
  let level = false;
  if (climbout) { p.climbout = false; p.alt = Math.max(1, p.alt); }
  else if (p.nav) {
    const ap = sec.airports[p.mode === "land" ? p.landAp : (p.toAp != null ? p.toAp : 0)];
    const iaf = iafOf(ap), vor = vorOf(ap);
    if (p.mode === "land" && p.nav !== "approach") p.nav = "join";      /* a shift saved before joins existed */
    if (p.nav === "join") {
      /* judged at the height it is going to, so a climb is not cut short */
      const top = Math.max(p.alt, p.talt == null ? 0 : p.talt);
      if (joinsFinal(ap, p.x, p.y, p.h, top)) { p.nav = "approach"; p.talt = 0; }
      else {
        const nh = navHeading(sec, p, (x, y, h) => joinsFinal(ap, x, y, h, top));
        if (nh >= 0) p.h = nh;
      }
    }
    /* "approach": straight down the runway heading, level until the slope */
    if (p.nav === "approach") level = finalDist(ap, p.x, p.y) > p.alt;
    if (p.nav === "iaf") {
      if (p.x === iaf.x && p.y === iaf.y && p.h === ap.rwy) p.nav = "vor";
      else {
        const nh = navHeading(sec, p, { x: iaf.x, y: iaf.y, h: ap.rwy });
        if (nh >= 0) p.h = nh;
      }
    }
    if (p.nav === "vor") {
      if (p.x === vor.x && p.y === vor.y) {
        p.nav = "pattern"; p.pat = 0; if (p.mode === "fly") p.mode = "hold"; p.h = (p.h + (p.holdDir > 0 ? 1 : 7)) % 8;
      }
    } else if (p.nav === "pattern") p.h = (p.h + (p.holdDir > 0 ? 1 : 7)) % 8;
  } else if (p.th !== null && p.th !== p.h) {
    p.h = (p.h + (p.tdir < 0 ? 7 : 1)) % 8;
  }
  if (!climbout && !level && p.talt !== null && p.talt !== p.alt) {
    p.alt += p.talt > p.alt ? 1 : -1;
    if (p.alt === 0) {
      /* the ground: the airport must be straight ahead, close, and the
       * heading the runway's, or this is a crash */
      const ap = sec.airports[p.landAp];
      let ahead = -1;
      if (ap && p.h === ap.rwy) for (let k = 1; k <= VOR_D; k++) if (p.x + DIRS[p.h][0] * k === ap.x && p.y + DIRS[p.h][1] * k === ap.y) ahead = k;
      if (ahead < 0) { finish(S, p, "crash", "CRASH", callsign(p) + " flew into the ground", "CRASH · into the ground"); return; }
      p.mode = "final"; p.nav = null;
    }
  }
  /* 2. move one dot */
  p.px = p.x; p.py = p.y;

    if (by) {

   * nothing is not a clean record, it is an empty one */

    if (!p.climbout && !p.nav && th != null && th !== p.h) h = (h + (turnDelta(p.h, th) < 0 ? 7 : 1)) % 8;

    this.busy = true;
    this.timer = setTimeout(() => { this.cur = null; this.busy = false; this.pump(); }, ms);
  },
  clear() { this.cut(); this.q = []; this.said.clear(); },
};

const KEYMAP_ACT = { hdgL: "heading left", hdgR: "heading right", altUp: "height up", altDown: "height down",

function keymap(name, w, h, keys, leaders) {
  const caps = keys.map(([cap, code, x, y, kw, kh]) =>
    `<g class="k${KEYS[code] ? " on" : ""}"><rect x="${x}" y="${y}" width="${kw}" height="${kh}" rx="3"/><text x="${x + kw / 2}" y="${y + kh / 2}">${cap}</text></g>`).join("");
  const off = { L: [-5, 0, "end"], R: [5, 0, "start"], T: [0, -9, "middle"], B: [0, 9, "middle"] };
  const leads = leaders.map(([code, side, ...lines]) => {
    const [x, y] = lines[0][lines[0].length - 1], [dx, dy, anchor] = off[side];
    return lines.map(l => `<polyline points="${l.join(" ")}"/><circle cx="${l[0][0]}" cy="${l[0][1]}" r="2"/>`).join("") +
      `<text x="${x + dx}" y="${y + dy}" text-anchor="${anchor}">${KEYMAP_ACT[KEYS[code]]}</text>`;
  }).join("");

const KEYMAP_K = 34, KEYMAP_P = 46, KEYMAP_G = KEYMAP_P - KEYMAP_K;
function keymapLeft() {
  const K = KEYMAP_K, P = KEYMAP_P, X = 112, Y = 34, O = [0, 12, 35];   // each row's stagger
  const kx = (c, r) => X + O[r] + c * P, ky = r => Y + r * P, cy = r => ky(r) + K / 2;
  const L = X - 18, R = kx(2, 2) + K + 16, B = ky(3) + K + 10, sx = kx(1, 2) + 23, sw = 136;
  const keys = [..."QWEASDZXC"].map((c, i) => [c, "Key" + c, kx(i % 3, i / 3 | 0), ky(i / 3 | 0), K, K]);
  keys.push(["space", "Space", sx, ky(3), sw, K]);
  const side = (code, c, r, s) => [code, s, s === "L" ? [[kx(c, r), cy(r)], [L, cy(r)]] : [[kx(c, r) + K, cy(r)], [R, cy(r)]]];
  return keymap("Left hand", 400, 234, keys, [
    side("KeyQ", 0, 0, "L"), side("KeyA", 0, 1, "L"), side("KeyZ", 0, 2, "L"),
    ["KeyW", "T", [[kx(1, 0) + K / 2, Y], [kx(1, 0) + K / 2, Y - 18]]],
    side("KeyE", 2, 0, "R"), side("KeyD", 2, 1, "R"), side("KeyC", 2, 2, "R"),
    // S drops between Z and X, which the stagger leaves under its middle
    ["KeyS", "B", [[kx(1, 1) + K / 2, ky(1) + K], [kx(1, 1) + K / 2, B]]],
    ["Space", "B", [[sx + sw / 2, ky(3) + K], [sx + sw / 2, B]]],

  const gx = c => kx(c + 1) - G / 2, gy = r => ky(r + 1) - GY / 2;   // the gap after a column, a row
  const L = X - 18, R = kx(3) + K + 16, T = Y - 18, B = ky(4) + K + 10, tall = 2 * PY - GY;
  const key = (cap, code, c, r, wu = 1, hu = 1) => [cap, code, kx(c), ky(r), wu * P - G, hu * PY - GY];
  const keys = [key("num", "NumLock", 0, 0), key("/", "NumpadDivide", 1, 0), key("*", "NumpadMultiply", 2, 0), key("−", "NumpadSubtract", 3, 0),

      <h3>When they act</h3><p>The pilot takes about four seconds to take a command in, then acts at the next dot. Sent just before a plane reaches a dot, it flies through that one and turns at the one after. A second command before the first is acted on replaces it; once the first is on the air, the controller says "correction". The <b>Learning</b> scope (<kbd>L</kbd>, or Settings) marks the dot where each command will take hold, and turns two planes amber one dot before they lose separation. On it a pilot heading for trouble in the next six miles calls it in, and the strip says what: OFF COURSE, EXIT HEIGHT, WEATHER, TERRAIN or RESTRICTED. On any scope a pilot three minutes in the hold asks out of it, and the first to see a thunderstorm reports it.</p>
      <h3>Your standing</h3><p>The header counts the shift's <b>errors</b> (crashes, bad exits, exits with an emergency), <b>conflict</b> seconds and <b>delay</b> minutes as they happen: under 30 seconds of conflict is a promotion, over a minute is the end of a career, and so are a crash, a bad exit or 45 minutes of delay. A trainee is never fired.</p>
