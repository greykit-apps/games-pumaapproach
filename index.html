<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* @gk-tokens-begin v0.1 -- greykit.games canon (games-meta STANDARD.md §4): the Tactical palette, PumaRally's (editor/render/palette.js). The copy of record is games-meta's canon/gk-tokens.css. */
:root{--bg:#05070f;--panel:#0a0e1a;--panel2:#0d1424;--line:#1b2540;--lit:#47609c;
  --text:#dbe4fb;--ink:#8b96b8;--dim:#7d8aa8;--accent:#54f2ff;--warn:#ffb000;--danger:#ff5266;
  --good:#4ade6a;--violet:#b47dff;--steel:#94a0c4;--blue:#4c8dff}
/* @gk-tokens-end */
:root {
  /* Tactical tribe: the canon block above is every Tactical game's palette.
     PumaApproach's own names follow: the scope's phosphor and its dots. */
  --scope: #06101c;
  --dot: #182438;
  --lane: #2a4064;
  --font-mono: ui-monospace, Menlo, Consolas, "Courier New", monospace;
}
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-mono); font-size: 13px; }
body { overflow: hidden; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 2px; cursor: pointer; padding: 6px 10px; }
button:hover:not(:disabled) { border-color: var(--lit); background: var(--panel2); }
button:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
button:disabled { opacity: .4; cursor: default; }
button.on { color: var(--bg); background: var(--accent); border-color: var(--accent); font-weight: 600; }
kbd { font: inherit; font-size: 10px; color: var(--dim); border: 1px solid var(--line); border-radius: 2px; padding: 0 4px; min-width: 16px; text-align: center; display: inline-block; }
a { color: var(--steel); }

/* ---- the game ---- */
#game { position: fixed; inset: 0; display: flex; flex-direction: column; }
#game[hidden] { display: none; }
#hud { display: flex; align-items: center; gap: 14px; padding: 6px 12px; border-bottom: 1px solid var(--line); background: var(--panel); min-height: 40px; flex-wrap: wrap; }
#hud .clock { font-size: 20px; font-weight: 600; letter-spacing: .08em; color: var(--accent); min-width: 7.5ch; font-variant-numeric: tabular-nums; }
#hud .where { color: var(--ink); font-size: 12px; line-height: 1.3; }
#hud .where b { color: var(--text); font-weight: 600; }
/* the shift's standing: conflict seconds against the 30 s that still gets a
   promotion and the minute that ends a career, delay against 45 minutes */
#standing { flex: 1; display: flex; align-items: baseline; gap: 6px; font-size: 11px; color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
#standing .k { letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
#standing .k + b { margin-right: 10px; }
#standing b { font-size: 13px; color: var(--text); font-weight: 600; }
#standing b.near { color: var(--warn); }
#standing b.over { color: var(--danger); }
#hud .btns { display: flex; gap: 6px; }
#hud .btns button { padding: 4px 9px; font-size: 12px; min-width: 32px; }
#hud .btns button[aria-pressed="true"] { color: var(--bg); background: var(--accent); border-color: var(--accent); font-weight: 600; }
#btn-fast.on { color: var(--bg); background: var(--warn); border-color: var(--warn); }
#speed { color: var(--warn); font-size: 11px; display: none; }
#speed.on { display: inline; }

#main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) clamp(300px, 27vw, 440px); }
#left { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
/* the scope fills the left pane, anchored to the bottom; the radio and the
   alarm lamps sit in the band above it, the room the 40:24 scope leaves */
#scope-wrap { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; padding: 8px; background: var(--bg); }
#band { position: absolute; top: 0; left: 0; right: 0; padding: 6px 12px 4px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
#radio { font-size: 13px; line-height: 1.45; min-height: 38px; }
#radio .ctl { color: var(--accent); }
#radio .pilot { color: var(--text); }
#radio .pilot.em { color: var(--warn); }
#radio .who { display: inline-block; width: 4ch; color: var(--dim); font-size: 11px; }
#lamps { display: flex; gap: 4px; flex-wrap: wrap; }
.lamp { font-size: 11px; letter-spacing: .08em; padding: 2px 6px; border: 1px solid var(--line); border-radius: 2px; color: var(--dim); background: var(--bg); transition: color .15s, border-color .15s, background .15s; }
.lamp.lit { color: var(--bg); background: var(--danger); border-color: var(--danger); font-weight: 600; animation: lamp .5s steps(2) infinite; }
.lamp.lit.amber { background: var(--warn); border-color: var(--warn); }
@keyframes lamp { 50% { opacity: .55; } }
#scope { display: block; background: var(--scope); border: 1px solid var(--line); border-radius: 2px; touch-action: none; max-width: 100%; max-height: 100%; }
#banner { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); padding: 6px 14px; background: rgba(5,7,15,.85); border: 1px solid var(--warn); color: var(--warn); letter-spacing: .2em; font-size: 12px; pointer-events: none; display: none; }
#banner.on { display: block; }
/* the two notes over the scope: a career-ending error, and the coach on a
   first shift */
#notice, #coach { position: absolute; left: 50%; transform: translateX(-50%); max-width: min(560px, calc(100% - 32px)); padding: 8px 12px; font-size: 12px; line-height: 1.5; background: rgba(5,7,15,.92); border-radius: 2px; }
#notice { bottom: 20px; border: 1px solid var(--danger); color: var(--text); white-space: nowrap; }
#notice b { color: var(--danger); }
#notice button { padding: 2px 8px; font-size: 12px; margin-left: 2px; border-color: var(--danger); }
#coach { bottom: 20px; border: 1px solid var(--accent); color: var(--text); display: flex; gap: 10px; align-items: start; }
#coach kbd { color: var(--accent); border-color: var(--lit); }
#coach button { padding: 0 6px; font-size: 16px; line-height: 1.2; }
#notice[hidden], #coach[hidden] { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#right { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); background: var(--panel); }
#strips { flex: 1; min-height: 80px; overflow-y: auto; padding: 6px; }
#strips h3, #panel h3 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); font-weight: 600; padding: 2px 4px 6px; }
.strip { display: grid; grid-template-columns: 34px 1fr auto; gap: 3px 10px; align-items: center; padding: 8px 10px; margin-bottom: 5px; border: 1px solid var(--line); border-radius: 2px; background: var(--bg); cursor: pointer; font-size: 15px; }
.strip:hover { border-color: var(--lit); }
.strip:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.strip.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.strip.warn { border-color: var(--warn); }
.strip.pending { opacity: .45; cursor: default; }
.strip .id { font-size: 26px; font-weight: 700; color: var(--accent); grid-row: span 2; text-align: center; }
.strip.puma .id { color: var(--violet); }
.strip .id .hot { display: block; font-size: 12px; font-weight: 700; color: var(--bg); background: var(--text); border-radius: 2px; line-height: 16px; margin: 2px auto 0; width: 20px; }
#panel .who .hotkey { font-size: 10px; color: var(--dim); white-space: nowrap; }
.strip .call { color: var(--text); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip .route { color: var(--ink); font-size: 13px; }
.strip .alt { text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
.strip .st { text-align: right; font-size: 12px; letter-spacing: .06em; color: var(--dim); }
.strip .st.warn { color: var(--warn); font-weight: 600; }
.strip .st.good { color: var(--good); }
.strip .st.bad { color: var(--danger); font-weight: 600; }
.strip.conf { border-color: var(--danger); }
.strip.em .call { color: var(--warn); }

#panel { border-top: 1px solid var(--line); padding: 8px; }
#panel .sel-none { color: var(--dim); font-size: 12px; padding: 6px 4px 10px; line-height: 1.5; }
/* the panel's rows keep their height: a longer status or callsign is cut,
   never wrapped, so the board above does not jump as the shift goes on */
#panel .who { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; padding: 0 4px 4px; }
#panel .who b { font-size: 15px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#panel .who span { color: var(--ink); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#panel .who .hotkey { color: var(--dim); font-size: 10px; text-align: right; }
#panel .who .route { grid-column: 1 / -1; }
#panel .now { display: flex; gap: 12px; padding: 0 4px 8px; font-size: 11px; color: var(--ink); white-space: nowrap; overflow: hidden; }
#panel .now b { color: var(--text); font-weight: 600; }
#panel .now .fuel.low { color: var(--warn); }
.cmd { display: grid; grid-template-columns: auto auto 1fr; gap: 8px; align-items: start; }
.compass { display: grid; grid-template-columns: repeat(3, 40px); grid-template-rows: repeat(3, 40px); gap: 3px; }
.compass button { padding: 0; font-size: 12px; min-height: 0; }
.compass .mid { display: grid; place-items: center; font-size: 11px; color: var(--accent); border: 1px solid var(--line); border-radius: 2px; background: var(--bg); line-height: 1.2; text-align: center; }
/* the heights, one column top-down like the bars under a plane, so up is
   up on the keys, on the glyph and here */
.alts { display: grid; grid-template-columns: 58px; gap: 3px; }
.alts button { padding: 0; height: 32px; font-size: 12px; font-variant-numeric: tabular-nums; }
.alts button[data-alt="0"] { color: var(--good); }
.alts button[data-alt="0"].on { color: var(--bg); background: var(--good); border-color: var(--good); }
.acts { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.acts button { font-size: 11px; padding: 6px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acts button.primary { color: var(--bg); background: var(--accent); border-color: var(--accent); font-weight: 600; height: 40px; }
.acts button.primary:hover:not(:disabled) { background: #8af6ff; border-color: #8af6ff; }
.acts button.primary kbd { color: var(--bg); border-color: rgba(5,7,15,.35); }
#log { height: 100px; overflow-y: auto; border-top: 1px solid var(--line); padding: 6px 10px; font-size: 11px; line-height: 1.5; color: var(--dim); }
#log .ctl { color: var(--accent); opacity: .8; }
#log .alarm { color: var(--danger); }
#log .sys { color: var(--ink); }
#log .pilot { color: var(--ink); }

/* ---- the title screen (greykit.games canon: the @gk-title script) and
   the scene behind it, shown only while the title is up ---- */
#title { position: fixed; inset: 0; z-index: 90; overflow-y: auto; }
#title[hidden] { display: none !important; }
body.on-title #game { visibility: hidden; }
.scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; display: none;
  background: radial-gradient(ellipse at 50% 60%, #0a1628 0%, #06101c 40%, #05070f 75%); }
body.on-title .scene { display: block; }
.scene svg, .scene canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
@keyframes sweep { to { transform: rotate(360deg); } }
.scene .sweep { transform-origin: 600px 400px; animation: sweep 6s linear infinite; }
@media (prefers-reduced-motion: reduce) { .scene .sweep { animation: none; } }

/* sheets: Settings, Help, the shift report, over the game or the title (which sits at 90) */
body > .gk-sheet { z-index: 100; }   /* the canon block injects its own .gk-sheet after this; body > outranks it */
.gk-sheet .gk-body .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 10px; }
.gk-sheet .gk-body .row button { font-size: 12px; }
.gk-sheet .gk-body .row button.on { color: var(--bg); background: var(--accent); border-color: var(--accent); font-weight: 600; }
.gk-sheet .gk-head button[data-x] { padding: 2px 8px; font-size: 16px; line-height: 1; }
.gk-sheet .gk-tabs button[aria-selected="true"] { border-color: var(--accent); color: var(--accent); }
.report { display: grid; grid-template-columns: auto 1fr; gap: 3px 16px; margin: 0 0 12px; }
.report .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--text); font-weight: 600; }
.report .bad { color: var(--danger); }
.report .good { color: var(--good); }
.verdict { font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 0 0 4px; }
.verdict.bad { color: var(--danger); }
.verdict.up { font-size: 22px; color: var(--good); letter-spacing: .16em; }
.verdict.bad.out { font-size: 20px; }
.why { color: var(--ink); margin: 0 0 14px; }
.row.quiet { margin-top: 6px; }
.row.quiet button { color: var(--dim); }
.gk-title .gk-sub { margin: 10px 0 0; font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: var(--dim); text-align: center; padding-left: .3em; }
.facility button b .rec { color: var(--good); font-weight: 400; font-size: 11px; margin-left: 6px; }
.facility { display: grid; grid-template-columns: 1fr; gap: 6px; margin: 0 0 10px; }
.facility button { text-align: left; display: flex; gap: 10px; align-items: baseline; padding: 8px 10px; }
.facility button b { min-width: 16ch; color: var(--text); }
.facility button span { color: var(--dim); font-size: 11px; }
.facility button:disabled { opacity: .55; }
.facility button:disabled span { color: var(--dim); }
.ladder td { padding: 2px 10px 2px 0; }
.ladder td.me { color: var(--accent); font-weight: 600; }

/* ---- phones: the band goes back into the flow above the scope, and the
   scope keeps a readable mile (14px) and pans sideways when the screen is
   narrower than that ---- */
@media (max-width: 860px) {
  #main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; overflow-y: auto; }
  #left { min-height: 0; }
  #scope-wrap { padding: 4px; min-height: 0; display: block; overflow-x: auto; touch-action: pan-x pan-y; scrollbar-width: none; }
  #band { position: sticky; left: 0; width: 100%; padding: 4px 8px; pointer-events: auto; }
  #radio { min-height: 0; font-size: 12px; }
  #scope { max-width: none; max-height: none; touch-action: pan-x pan-y; }
  #right { border-left: 0; border-top: 1px solid var(--line); }
  #strips { max-height: 220px; }
  #log { height: 90px; }
  #hud { gap: 6px 10px; padding: 6px 8px; }
  #hud .where { display: none; }
  #hud .btns { margin-left: auto; }
  .lamp { padding: 2px 5px; }
  .compass { grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 46px); }
  .alts { grid-template-columns: 64px; }
  .alts button { height: 38px; }
  #notice, #coach { position: sticky; left: 8px; transform: none; max-width: none; margin: 6px 4px 0; }
}
/* without a keyboard the key hints go, whole phrases at a time, so what is
   left still reads as a sentence; .tp is the touch wording in their place */
.tp { display: none; }
@media (pointer: coarse) { .acts button { padding: 10px 8px; } .kb, kbd.hint { display: none; } .tp { display: inline; } }
@media (prefers-reduced-motion: reduce) { .lamp.lit { animation: none; } }
</style>
</head>
<body>
<div class="scene" id="scene" aria-hidden="true"></div>
<div id="game" hidden>
  <header id="hud">
    <span class="clock" id="clock">10:00:00</span>
    <span class="where" id="where"></span>
    <div id="standing" title="Under 30 seconds of conflict on the shift to be promoted; over a minute, or 45 minutes of delay, and you are fired">
      <span class="k">conflict</span> <b id="st-conf">0 s</b><span class="k">delay</span> <b id="st-delay">0 min</b>
    </div>
    <span id="speed">▶▶ FAST</span>
    <div class="btns">
      <button id="btn-pause" aria-label="Pause" aria-pressed="false" title="Pause (P)">⏸</button>
      <button id="btn-fast" aria-label="Fast time, while held" title="Fast time, while held (Space)">▶▶</button>
      <button id="btn-aids" aria-label="Scope aids" aria-pressed="false" title="Scope aids: Learning or Classic (L)">LEARN</button>
      <button id="btn-help" aria-label="Help" title="Help (H)">?</button>
      <button id="mute-btn" aria-label="Sound" aria-pressed="true" title="Sound (M)">♪</button>
      <button id="btn-menu" aria-label="Menu" title="Back to the title screen. The shift waits.">MENU</button>
    </div>
  </header>
  <div id="main">
    <div id="left">
      <div id="scope-wrap">
        <div id="band">
          <div id="radio" aria-live="polite"><div class="ctl"><span class="who">ATC</span><span id="radio-ctl"></span></div><div class="pilot"><span class="who">PLT</span><span id="radio-pilot"></span></div></div>
          <div id="lamps" aria-hidden="true"></div>
        </div>
        <canvas id="scope" width="1000" height="600" role="img" aria-label="Radar scope"></canvas>
        <div id="banner"></div>
        <div id="notice" hidden><b>This shift ends your career.</b> Work it to the hour for the pay, or <button data-act="endnow">end it now</button></div>
        <div id="coach" hidden><span id="coach-text"></span><button data-act="coach-x" aria-label="Dismiss">&times;</button></div>
      </div>
    </div>
    <div id="right">
      <div id="strips"><h3>Flight plans</h3><div id="strip-list"></div></div>
      <div id="panel"></div>
      <div id="log" aria-live="off"></div>
    </div>
  </div>
  <div id="sr" class="sr-only" role="status" aria-live="assertive"></div>
</div>
<div id="title" hidden></div>
<script>
/* @gk-title-begin v0.3 -- greykit.games canon (games-meta STANDARD.md §3),
 * byte-identical in every Tactical game. The copy of record is games-meta's
 * canon/gk-title.js: change it there, bump the version, copy it to all, and
 * tools/diff-standard.sh says where it differs. Plain script, no imports or
 * exports, so a single-file game can paste it into a classic <script>. */

/* ---- scrollbars, page-wide: a thin steel thumb on whatever ground it
   crosses, lit on hover. scrollbar-color covers Firefox and current
   Chromium; the -webkit- rules are for Safari, which ignores it. ---- */
*{scrollbar-width:thin;scrollbar-color:#2a3a5e transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:#2a3a5e;border:2px solid transparent;background-clip:padding-box;border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#47609c;background-clip:padding-box}

/* ---- boot ---- */
/* above anything a game layers its own screens with */
.gk-boot{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:var(--bg);

.gk-boot .gk-bar{position:absolute;top:0;left:0;height:2px;width:100%;background:var(--accent);
  box-shadow:0 0 12px var(--accent);transform-origin:0 50%;transform:scaleX(0);
  animation:gk-bar 1.8s cubic-bezier(.22,1,.36,1) .1s forwards}

/* the whole face is the mark beside its mirror; the frame edge cuts the
   right half away as the face slides, and the left half -- the mark flipped,
   as greykit.com shows it -- is what stays, centred */
.gk-boot .gk-face{position:relative;width:calc(var(--S) * 2);height:var(--S);opacity:0;
  clip-path:inset(-40% 36.25% -40% -40%);animation:gk-show .2s ease-out .05s forwards}
.gk-boot .gk-slide{position:absolute;inset:0;transform:translateX(calc(var(--d) * -1));
  animation:gk-slide .6s cubic-bezier(.65,0,.35,1) .5s forwards}
.gk-boot .gk-lh,.gk-boot .gk-rh{position:absolute;top:0;width:var(--S);height:var(--S)}
/* the halves overlap by 2px, the left on top: two images laid edge to edge
   are anti-aliased edge by edge, and some browsers (Brave) leave a hairline
   of background between them */
.gk-boot .gk-lh{left:0;z-index:1}
.gk-boot .gk-rh{left:calc(var(--S) - 2px)}

  background:linear-gradient(110deg,transparent 38%,rgba(255,255,255,.95) 50%,transparent 62%) no-repeat;
  background-size:300% 100%;background-position:120% 0;
  -webkit-mask:url(${MARK}) center/100% 100% no-repeat;mask:url(${MARK}) center/100% 100% no-repeat;
  animation:gk-glint .65s ease-in-out 1.2s}
.gk-boot.gk-done .gk-face{animation:gk-out .3s ease-in forwards}

  box-shadow:0 0 16px 2px rgba(84,242,255,.6);opacity:0}

@keyframes gk-bar{0%{transform:scaleX(0)}55%{transform:scaleX(.72)}100%{transform:scaleX(.92)}}
@keyframes gk-bar-end{from{transform:scaleX(.92)}to{transform:scaleX(1);opacity:0}}
@keyframes gk-show{to{opacity:1}}

  25%{filter:invert(1) brightness(.95) drop-shadow(0 0 14px rgba(84,242,255,.55))}
  75%{filter:invert(1) brightness(.85) drop-shadow(0 0 8px rgba(84,242,255,.4))}}
@keyframes gk-glint{0%{opacity:1;background-position:120% 0}100%{opacity:1;background-position:-20% 0}}

/* ---- title ---- */
.gk-title{position:relative;min-height:100dvh;display:flex;flex-direction:column;align-items:center;

/* the menu sits in the middle of the screen, and the name above it: three

`;

const reduced = () => typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;
const escHTML = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

/**
 * Run the boot over the page while the game loads.
 *   lines: what the log says straight away (strings), one every ~0.55s
 * Returns { finish(lines), cancel() }. finish() takes the lines to add once
 * loading is done, plays out the boot's minimum run, and resolves when the
 * boot starts to fade -- mount the title before calling it, so the fade
 * reveals it.
 */
function runBoot({ lines = [] } = {}) {
  if (reduced()) return { finish: async () => {}, cancel() {} };
  const el = document.createElement("div");
  el.className = "gk-boot";
  el.setAttribute("aria-hidden", "true");
  el.innerHTML = '<div class="gk-bar"></div><div class="gk-face"><div class="gk-slide">' +
    '<div class="gk-lh"><div class="gk-pulse"><img alt=""><div class="gk-glint"></div></div></div>' +
    '<div class="gk-rh"><img alt=""></div></div></div>' +
    '<div class="gk-log"></div><div class="gk-scan"></div><div class="gk-skip">any key to skip</div>';
  /* set, not written into the markup: asset checkers read every src attribute as a file path */
  el.querySelectorAll("img").forEach(img => { img.src = MARK; });
  document.body.appendChild(el);
  const log = el.querySelector(".gk-log");
  const t0 = performance.now();
  const timers = [];
  const say = html => { const d = document.createElement("div"); d.innerHTML = "&gt; " + html; log.appendChild(d); };
  lines.forEach((l, i) => timers.push(setTimeout(() => say(l), 150 + i * 550)));
  /* a key that skips the boot is spent on it: it never reaches the title underneath */
  let skipped = false, skip = () => {};
  const onSkip = ev => { ev.preventDefault(); ev.stopPropagation(); skipped = true; skip(); };
  window.addEventListener("keydown", onSkip, true);
  el.addEventListener("pointerdown", onSkip);
  const wait = ms => new Promise(r => { const t = setTimeout(r, ms); timers.push(t); skip = () => { clearTimeout(t); r(); }; });
  const off = () => { timers.forEach(clearTimeout); window.removeEventListener("keydown", onSkip, true); };
  return {
    async finish(more = []) {
      /* the rest of the log, then ready: never before the face has pulsed */
      const at = Math.max(150 + lines.length * 550, performance.now() - t0);
      for (const [i, l] of more.entries()) timers.push(setTimeout(() => say(l), Math.max(0, at + i * 300 - (performance.now() - t0))));
      const readyAt = Math.max(1850, at + more.length * 300);
      if (!skipped) await wait(readyAt - (performance.now() - t0));
      say('<span class="gk-ok">ready</span>');
      el.classList.add("gk-ready");
      el.classList.add("gk-done");
      if (!skipped) await wait(550);
      off();
      el.classList.add("gk-out");
      setTimeout(() => el.remove(), 400);
    },
    cancel() { off(); el.remove(); }
  };
}

/**
 * The title screen's markup, for a game that draws its own screens: the same
 * HTML mountTitle puts in. cfg is mountTitle's name, items and primary;
 * scene: true leaves a .scene for the game's backdrop, and a game whose
 * backdrop is already drawn behind its pages leaves it out.
 */
function titleHTML(cfg) {
  const items = cfg.items.filter(Boolean);
  return '<div class="gk-title">' + (cfg.scene ? '<div class="scene" aria-hidden="true"></div>' : "") + '<div class="gk-shade" aria-hidden="true"></div>' +
    '<main><div class="gk-name"><h1 aria-label="' + escHTML(cfg.name) + '">' + escHTML(cfg.name) + '</h1><div class="gk-rule"></div></div><nav class="gk-menu" aria-label="Main menu">' +
    items.map(it => it === "gap" ? '<div class="gk-gap"></div>' :
      '<button data-act="' + it.act + '"' + (it.act === cfg.primary ? ' class="gk-primary"' : "") + "><kbd>" + escHTML(it.key) + '</kbd><span class="gk-lbl">' +
      escHTML(it.label) + "</span>" + (it.meta ? '<span class="gk-meta">' + escHTML(it.meta) + "</span>" : "") + "</button>").join("") +
    '</nav></main><footer><span class="gk-credit">Built by <a href="https://greykit.com/" target="_blank" rel="noopener">greykit.com</a></span></footer></div>';
}

/* the name decodes out of noise once, as the screen arrives -- by the
 * clock, not by ticks, so a throttled background tab still ends on time */
function decodeTitle(h1, text) {
  if (reduced()) return;
  const glyphs = "▚▞▖▗▘▝#/\\<>=+", t0 = performance.now(), ms = 400;
  const t = setInterval(() => {
    const p = (performance.now() - t0) / ms;
    if (!h1.isConnected || p >= 1) { clearInterval(t); h1.textContent = text; return; }
    const done = Math.floor(text.length * p);
    h1.textContent = text.slice(0, done) + [...text.slice(done)].map(c => c === " " ? " " : glyphs[Math.random() * glyphs.length | 0]).join("");
  }, 28);
}

/* The title's stylesheet, once, for a game that does not build its own CSS
 * around TITLE_CSS. */
function injectTitleCSS() {
  if (!document.getElementById("gk-title-css")) document.head.insertAdjacentHTML("beforeend", '<style id="gk-title-css">' + TITLE_CSS + "</style>");
}

/* The boot log's first line: the page being reloaded, escaped. */
function bootReloadLine() {
  return "reload <b>" + escHTML(location.pathname.replace(/index\.html$/, "")) + "</b>";
}

/* The entrance: the menu rises, the name decodes, the default is focused.
 * t is the .gk-title (the page's, if left out); the name is read off the h1. */
function revealTitle(t = document.querySelector(".gk-title")) {
  if (!t) return;
  t.classList.add("gk-rise");
  const h1 = t.querySelector("h1");
  decodeTitle(h1, h1.getAttribute("aria-label"));
  const b = t.querySelector(".gk-primary") || t.querySelector(".gk-menu button");
  if (b) b.focus({ preventScroll: true });
}

/* The menu button a key presses: the one whose <kbd> shows that key, and the
 * ? item for h and / as well. Read off the menu itself, so a key and its
 * label cannot disagree. null when the key is not the menu's. */
function titleKeyButton(menu, key) {
  const k = key.length === 1 ? key.toLowerCase() : key;
  const bs = [...menu.querySelectorAll("button")], kbd = b => (b.querySelector("kbd") || {}).textContent || "";
  return bs.find(b => kbd(b).toLowerCase() === k) || ((k === "h" || k === "/") && bs.find(b => kbd(b) === "?")) || null;
}

/* ArrowDown / ArrowUp through the menu, wrapping. true when the key was one. */
function titleArrow(menu, ev) {
  if (ev.key !== "ArrowDown" && ev.key !== "ArrowUp") return false;
  const bs = [...menu.querySelectorAll("button")], i = bs.indexOf(document.activeElement);
  ev.preventDefault();
  bs[(i + (ev.key === "ArrowDown" ? 1 : -1) + bs.length) % bs.length].focus();
  return true;
}

/* A question or a notice in the title's sheet, from any screen of the game,
 * in place of window.confirm and window.alert (STANDARD.md §11): those are
 * silently answered "no", or never shown, where a page is embedded, and a
 * button that does nothing reads as broken. confirmSheet resolves true only
 * on the yes button; Cancel, Escape and the backdrop resolve false.
 * alertSheet resolves when it is dismissed. While one is up it has the keys:
 * Tab stays inside it and nothing reaches the game behind. Focus goes back
 * to whatever had it. */
function confirmSheet(question, yes, title = "Are you sure?") { return dialogSheet(title, question, yes, "Cancel"); }
function alertSheet(message, title = "Notice") { return dialogSheet(title, message, "OK", null); }
function dialogSheet(title, text, yes, no) {
  return new Promise(resolve => {
    const back = document.activeElement;
    const el = document.createElement("div");
    el.className = "gk-sheet";
    el.setAttribute("role", "alertdialog");
    el.setAttribute("aria-modal", "true");
    el.setAttribute("aria-label", title);
    el.innerHTML = '<div class="gk-box"><div class="gk-head"><h2>' + escHTML(title) + '</h2></div><div class="gk-body"><p>' + escHTML(text) +
      "</p><div class='gk-row'><button data-yes>" + escHTML(yes) + "</button>" + (no ? "<button data-no>" + escHTML(no) + "</button>" : "") + "</div></div></div>";
    const done = v => {
      document.removeEventListener("keydown", onKey, true);
      el.remove();
      if (back && back.isConnected && back.focus) back.focus({ preventScroll: true });
      resolve(v);
    };
    const onKey = ev => {
      if (ev.key === "Escape") { ev.preventDefault(); ev.stopPropagation(); done(false); return; }
      if (ev.key === "Tab") {
        const bs = [...el.querySelectorAll("button")], i = bs.indexOf(document.activeElement);
        ev.preventDefault();
        bs[(i + (ev.shiftKey ? -1 : 1) + bs.length) % bs.length].focus();
      }
      /* nothing reaches the game behind; Enter and Space still press the
         focused button, which is their default, not a listener's */
      ev.stopPropagation();
    };
    el.addEventListener("click", ev => {
      if (ev.target === el) return done(false);
      const b = ev.target.closest("button");
      if (b) done(b.hasAttribute("data-yes"));
    });
    document.addEventListener("keydown", onKey, true);
    document.body.appendChild(el);
    el.querySelector("[data-yes]").focus();
  });
}

/**
 * The title screen, into host.
 *   name      the game's name
 *   items     the menu, top to bottom: { act, label, key, meta? }, or "gap"
 *             before Settings / Help / About; anything falsy is left out
 *   primary   the act that is the default (lit, and focused)
 *   scene(el) draws the game's backdrop into el
 *   help      [[tab, html], ...]   about: html
 *   settings  { html(), onClick(button, sheet) }; sheet.confirm() as below
 *   onAct(act, ui) every other item; ui.confirm(question, yes) resolves true
 *             or false, asked in a sheet of this screen's own: window.confirm
 *             is silently answered "no" where a page is embedded, and a
 *             button that does nothing reads as broken
 * Returns { reveal(), unmount() }. reveal() runs the title's entrance; call it
 * as the boot fades (or at once, coming back from a game).
 */
function mountTitle(host, cfg) {
  const ctl = new AbortController();
  const sig = { signal: ctl.signal };
  host.innerHTML = titleHTML(cfg);
  const root = host.firstChild, menu = root.querySelector(".gk-menu");
  if (cfg.scene) cfg.scene(root.querySelector(".scene"));
  const focusPrimary = () => { const b = menu.querySelector(".gk-primary") || menu.querySelector("button"); if (b) b.focus({ preventScroll: true }); };

  let sheet = null;
  function openSheet(title, { tabs, html, onClick, refresh }) {
    closeSheet();
    const el = document.createElement("div");
    el.className = "gk-sheet";
    el.setAttribute("role", "dialog");
    el.setAttribute("aria-modal", "true");
    el.setAttribute("aria-label", title);
    let tab = 0;
    const draw = () => {
      el.innerHTML = '<div class="gk-box"><div class="gk-head"><h2>' + escHTML(title) + '</h2><button data-x aria-label="Close">&times;</button></div>' +
        (tabs ? '<div class="gk-tabs" role="tablist">' + tabs.map(([t], i) => '<button role="tab" data-tab="' + i + '" aria-selected="' + (i === tab) +
          '" aria-pressed="' + (i === tab) + '">' + escHTML(t) + "</button>").join("") + "</div>" : "") +
        '<div class="gk-body">' + (tabs ? tabs[tab][1] : html()) + "</div></div>";
    };
    draw();
    const api = { refresh: () => { draw(); }, close: () => closeSheet(), confirm: (q, yes) => ask(q, yes) };
    el.addEventListener("click", ev => {
      if (ev.target === el) return closeSheet();
      const b = ev.target.closest("button");
      if (!b) return;
      if (b.hasAttribute("data-x")) return closeSheet();
      if (b.dataset.tab !== undefined) { tab = +b.dataset.tab; draw(); el.querySelector('[data-tab="' + tab + '"]').focus(); return; }
      if (onClick) onClick(b, api);
    });
    document.body.appendChild(el);
    sheet = el;
    (el.querySelector('[role="tab"][aria-selected="true"]') || el.querySelector("[data-x]")).focus();
  }
  function closeSheet() {
    if (!sheet) return;
    sheet.remove(); sheet = null;
    const f = onSheetClose; onSheetClose = null;
    if (f) f();
    focusPrimary();
  }

  /** A yes-or-no question in a sheet; resolves true only on the yes button. */
  function ask(question, yes) {
    return new Promise(resolve => {
      let answered = false;
      const done = v => { if (answered) return; answered = true; resolve(v); };
      openSheet("Are you sure?", {
        html: () => "<p>" + escHTML(question) + "</p><div class='gk-row'><button data-yes>" + escHTML(yes) + "</button><button data-no>Cancel</button></div>",
        onClick: (b, s) => { if (b.hasAttribute("data-yes")) { done(true); s.close(); } else if (b.hasAttribute("data-no")) s.close(); }
      });
      sheet.querySelector("[data-yes]").focus();
      onSheetClose = () => done(false);
    });
  }
  let onSheetClose = null;

  function act(a) {
    if (a === "help" && cfg.help) return openSheet("Help", { tabs: cfg.help });
    if (a === "about" && cfg.about) return openSheet("About", { html: () => cfg.about });
    if (a === "settings" && cfg.settings) return openSheet("Settings", cfg.settings);
    cfg.onAct(a, { confirm: ask });
  }
  menu.addEventListener("click", ev => { const b = ev.target.closest("button"); if (b) act(b.dataset.act); }, sig);
  document.addEventListener("keydown", ev => {
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    if (sheet) { if (ev.key === "Escape") { ev.preventDefault(); closeSheet(); } return; }
    if (ev.target.closest && ev.target.closest("input,select,textarea")) return;
    const hit = titleKeyButton(menu, ev.key);
    if (hit) { ev.preventDefault(); act(hit.dataset.act); return; }
    titleArrow(menu, ev);
  }, sig);

const MAX_RANK = 7;                              /* GS-13 */

/* mulberry32: a small seeded generator, so a seed and the command log replay

 * terrain and weather are the controller's problem. */

/* ---- a shift ---- */

    return true;
  }
  if (c.op === "land") {

    const ap = sec.airports[c.ap];
    if (!ap) return false;
    radio(S, "ctl", callsign(p) + ", cleared to land " + ap.name, [...sayCall(p), "cleared", "to", "land", "runway", ...sayHdg(ap.rwy)]);

/* the pilot does it: at a dot for a plane in the air, on the next tick for

  if (c.op === "vector") {
    const d = turnDelta(p.h, c.h);
    p.tdir = c.dir || (d < 0 ? -1 : d > 0 ? 1 : 0);

    if (c.alt != null) p.talt = c.alt;
    else if (p.talt === 0) p.talt = p.alt;              /* pulled off the approach: level off */

     * by the IAF when it is already lined up or crossing the final */

/* ---- the clock ---- */
function finish(S, p, outcome, lamp, text) {

  if (lamp) alarm(S, lamp, text);

function stepPlane(S, p) {

  /* 0. a command taken in by now takes hold at this dot */
  if (p.next && S.t >= p.next.ready) { applyCommand(S, p, p.next.c); p.next = null; }
  /* 1. what it does at this dot: a turn, then altitude. A departure's first
   * dot is its climb-out: straight down the runway to 1,000 ft, whatever it
   * was told, because it is taking off and not hovering; the clearance's
   * turn and climb start from the dot after. */
  const climbout = p.climbout;
  let level = false;
  if (climbout) { p.climbout = false; p.alt = Math.max(1, p.alt); }
  else if (p.nav) {
    const ap = sec.airports[p.mode === "land" ? p.landAp : (p.toAp != null ? p.toAp : 0)];
    const iaf = iafOf(ap), vor = vorOf(ap);
    if (p.mode === "land" && p.nav !== "approach") p.nav = "join";      /* a shift saved before joins existed */

      const top = Math.max(p.alt, p.talt == null ? 0 : p.talt);
      if (joinsFinal(ap, p.x, p.y, p.h, top)) { p.nav = "approach"; p.talt = 0; }
      else {
        const nh = navHeading(sec, p, (x, y, h) => joinsFinal(ap, x, y, h, top));
        if (nh >= 0) p.h = nh;
      }
    }
    /* "approach": straight down the runway heading, level until the slope */
    if (p.nav === "approach") level = finalDist(ap, p.x, p.y) > p.alt;
    if (p.nav === "iaf") {
      if (p.x === iaf.x && p.y === iaf.y && p.h === ap.rwy) p.nav = "vor";
      else {
        const nh = navHeading(sec, p, { x: iaf.x, y: iaf.y, h: ap.rwy });
        if (nh >= 0) p.h = nh;

    if (p.nav === "vor") {

        p.nav = "pattern"; p.pat = 0; if (p.mode === "fly") p.mode = "hold"; p.h = (p.h + (p.holdDir > 0 ? 1 : 7)) % 8;

    p.alt += p.talt > p.alt ? 1 : -1;

       * heading the runway's, or this is a crash */

  p.x += DIRS[p.h][0]; p.y += DIRS[p.h][1];
  /* 3. what is at the new dot */

    const ap = sec.airports[p.landAp];
    if (p.x === ap.x && p.y === ap.y) {
      if (p.kind === "arr" && p.landAp === p.toAp) {
        finish(S, p, p.emergency ? "emland" : "landed");
        radio(S, "pilot", callsign(p) + ", runway in sight, good day", [...sayCall(p), "good", "day"]);

      return;
    }
  }
  if (!inside(sec, p.x, p.y)) { finish(S, p, p.emergency ? "emexit" : "badexit", "EXIT FIX", callsign(p) + " left the sector uncontrolled"); return; }
  const fix = sec.fixes.find(f => f.x === p.x && f.y === p.y);
  if (fix) {
    if (p.emergency) finish(S, p, "emexit", "EMERGENCY", callsign(p) + " left with an emergency");
    else if (p.kind === "arr") finish(S, p, "badexit", "EXIT FIX", callsign(p) + " was bound for " + p.to);
    else if (fix.n !== p.to) finish(S, p, "badexit", "EXIT FIX", callsign(p) + " left via " + fix.n + ", not " + p.to);
    else if (p.alt !== 4) finish(S, p, "badexit", "EXIT ALT", callsign(p) + " left at " + altText(p.alt) + ", not 4,000");

    return;
  }
  if (S.storm && p.alt > 0 && inStorm(S, p.x, p.y)) { finish(S, p, "crash", "CRASH", callsign(p) + " flew into the thunderstorm"); return; }
  if (sec.mountains && p.alt < 4 && sec.mountains(p.x, p.y)) { finish(S, p, "crash", "CRASH", callsign(p) + " flew into the mountains"); return; }
  if (sec.restricted && sec.restricted(p.x, p.y)) { finish(S, p, "crash", "CRASH", callsign(p) + " was shot down over the restricted zone"); return; }
}

/* a thunderstorm: a blob of cells, moving east at a light plane's pace */
const STORM_SHAPE = [[0, 0], [1, 0], [2, 0], [0, 1], [1, 1], [2, 1], [3, 1], [1, 2], [2, 2], [1, -1], [2, -1]];

function tick(S) {

    const p = makeFlight(S);

    S.storm = { x: -4, y: 3 + ri(S, sec.H - 8), phase: 0 };
    alarm(S, "STORM", "Thunderstorm moving in from the west");
  }
  if (S.storm && ++S.storm.phase >= 4) { S.storm.phase = 0; S.storm.x++; if (S.storm.x > sec.W + 1) S.storm = null; }

  for (const p of [...S.planes]) {

        if (p.kind === "dep") { p.mode = "ground"; radio(S, "pilot", callsign(p) + ", ready for departure, " + p.from + " to " + p.to, [...sayCall(p), "with", "you"], true); }

      }

    }
    if (p.mode === "ground") {
      if (p.next && S.t >= p.next.ready && applyCommand(S, p, p.next.c)) { p.next = null; continue; }
      if (S.t - p.posted > p.budget) { p.delay++; S.delayTicks++; if (p.al === "PU") S.delayPuma++; }

    }

    p.fuel--;

      radio(S, "pilot", "mayday, " + callsign(p) + ", " + Math.ceil(p.fuel / TPM) + " minutes fuel", ["mayday", ...sayCall(p), ...sayNum(Math.ceil(p.fuel / TPM)), "minutes", "fuel"]);
    }
    if (p.fuel <= 0) { finish(S, p, "crash", "CRASH", callsign(p) + " ran out of fuel"); continue; }
    if (S.t - p.enter > p.budget) { p.delay++; S.delayTicks++; if (p.al === "PU") S.delayPuma++; }

    }

  }

}

/* ---- the shift's report and the career ---- */

   * nothing is not a clean record, it is an empty one */
  return {
    ...c, completions, conflictSec, delayMin, major,
    bonus: Math.max(0, bonusRaw),
    salary: (S.rank + 1) * 500,
    perfect: completions > 0 && major === 0 && S.conflictTicks === 0 && S.delayTicks === 0,
    promoted: completions > 0 && major === 0 && conflictSec < 30 && S.rank < MAX_RANK,

/* ---- a look one dot ahead: the pairs that will have lost separation

  const ahead = air.map(p => {
    let h = p.h, th = p.th, talt = p.talt;
    /* a command taken in before the next dot takes hold there */
    const n = p.next && p.next.c;
    if (n && p.next.ready <= S.t + (p.period - p.phase) && n.op === "vector" && p.mode !== "final") { th = n.h; talt = n.alt; }
    if (!p.climbout && !p.nav && th != null && th !== p.h) h = (h + (turnDelta(p.h, th) < 0 ? 7 : 1)) % 8;
    let alt = p.alt;
    if (p.climbout) alt = Math.max(1, alt);
    else if (talt != null && talt !== alt) alt += talt > alt ? 1 : -1;
    return { id: p.id, x: p.x + DIRS[h][0], y: p.y + DIRS[h][1], alt };

    if (a.alt > 0 && b.alt > 0 && ((d2 < 9 && da < 1) || (d2 <= 2 && da < 2))) { out.add(a.id); out.add(b.id); }

/* ============================================================

     holds the mic: a command and its readback go to the front of the
     queue. A second command to the same plane replaces the first: quietly
     if the first was not yet said, with "correction" if it was. */
  sources: [], timer: 0, cur: null,
  said: new Set(),                /* planes whose last command was said but not yet read back */
  say(item) {
    this.q.push(Object.assign({ kind: "chat" }, item));
    /* a backed-up frequency loses the oldest chatter, never a command or a check-in */
    const chat = this.q.filter(i => i.kind === "chat" && !i.checkin);
    if (chat.length > 4) this.q = this.q.filter(i => i.kind !== "chat" || i.checkin || chat.indexOf(i) >= chat.length - 4);
    this.pump();
  },
  cmd(ctl, readback, id, supersede) {
    let correction = false;
    if (supersede) {
      const mine = i => i.id === id && i.sup && (i.kind === "cmd" || i.kind === "rb");
      /* the old command, or its readback, on the air now: cut it off */
      if (this.cur && mine(this.cur)) { this.cut(); correction = true; }
      /* the old command already said, its readback still to come */
      else if (this.said.has(id)) correction = true;
      this.q = this.q.filter(i => !mine(i));
    }
    const items = [];
    if (ctl) items.push(Object.assign({}, ctl, { kind: "cmd", id, sup: supersede,
      text: (correction ? "correction, " : "") + ctl.text, say: correction ? ["correction", ...ctl.say] : ctl.say }));
    for (const r of readback) items.push(Object.assign({}, r, { kind: "rb", id, sup: supersede }));
    /* behind any other command already waiting, ahead of all chatter */
    let at = 0;
    while (at < this.q.length && this.q[at].kind !== "chat") at++;
    this.q.splice(at, 0, ...items);
    this.pump();
  },
  cut() {
    for (const s of this.sources) { try { s.stop(); } catch (e) { /* already stopped */ } }
    this.sources = [];
    clearTimeout(this.timer);
    this.cur = null; this.busy = false;
  },
  pump() {
    if (this.busy || !this.q.length) return;
    const it = this.q.shift();
    this.cur = it; this.sources = [];
    if (it.kind === "cmd" && it.sup) this.said.add(it.id);
    if (it.kind === "rb") this.said.delete(it.id);
    showRadio(it);
    /* above 1x, or with a backlog, only a plane checking in is heard */
    const spoken = prefs.voice && !muted && (it.checkin || (loop.speed <= 1 && this.q.length < 4)) ? this.speak(it.say, it.who) : 0;
    const ms = spoken ? spoken * 1000 + 250 : Math.min(1800, 180 + it.say.length * 110);
    this.busy = true;
    this.timer = setTimeout(() => { this.cur = null; this.busy = false; this.pump(); }, ms);
  },
  clear() { this.cut(); this.q = []; this.said.clear(); },
};

async function confirmForget() {
  if (await confirmSheet("Forget everything PumaApproach has saved in this browser, and end any shift in progress? This cannot be undone.", "Forget everything")) forgetEverything();
}
/* Settings' "Forget everything" (games-meta STANDARD.md §2): every key the
   game owns, found by its prefix, and only those -- every game on greykit.com
   shares one origin, so one storage. */
function forgetEverything() {
  for (const area of ["localStorage", "sessionStorage"]) {
    try {
      const s = window[area];
      for (let i = s.length - 1; i >= 0; i--) { const k = s.key(i); if (k && k.startsWith("pumaapproach")) s.removeItem(k); }
    } catch (e) { /* no storage */ }
  }
  location.reload();
}

const glyph = (c, long) => long && /Enter$/.test(c) ? "Enter" : GLYPH[c] || c.replace(/^Key|^Numpad/, "");
/* the key for an action in the layout last used, for the hints */
const hint = (a, long) => glyph(LAYOUTS[prefs.layout][a], long);
document.addEventListener("keydown", e => {
  if (sheet) { if (e.key === "Escape") { e.preventDefault(); closeSheet(); } else if (sheet.onKey && !e.ctrlKey && !e.metaKey && !e.altKey) sheet.onKey(e); return; }
  if (titleOpen) { if (!e.ctrlKey && !e.metaKey && !e.altKey) titleKey(e); return; }
  if (!S || !loop.running) return;
  /* Space only ever runs the clock, whatever has the focus: a button it
     would otherwise press is Enter's */
  if (KEYS[e.code] === "fast" && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); loop.fast = true; return; }
  /* a button in the header or the panel has the focus: Tab and Enter are
     the browser's there, and walk or press the buttons */
  const onButton = e.target.closest && e.target.closest("#hud, #panel, #scope-wrap button");
  if (onButton && (e.key === "Tab" || (e.key === "Enter" && e.target.tagName === "BUTTON"))) return;
  /* quick keys, the way an RTS does its groups: Ctrl (or Shift) and a digit
     on the top row puts the selected plane on that digit; the digit alone
     selects it. The numpad's digits stay controls. */
  const digit = /^Digit(\d)$/.test(e.code) ? e.code.slice(5) : null;
  if (digit && (e.ctrlKey || e.shiftKey) && !e.altKey && !e.metaKey) {
    e.preventDefault();
    if (!ui.sel || replay) return;
    for (const d in S.hot) if (S.hot[d] === ui.sel) delete S.hot[d];
    S.hot[digit] = ui.sel; play("select"); renderStrips(); renderPanel();
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (digit) { e.preventDefault(); if (S.hot[digit] && find(S, S.hot[digit])) select(S.hot[digit]); return; }
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key, a = KEYS[e.code];
  if (k === "m") { toggleMute(); return; }
  if (k === "h" || k === "?") { showHelp(); return; }
  if (k === "l") { toggleAids(); return; }
  if (k === "p" || k === "Pause") { e.preventDefault(); togglePause(); return; }
  /* Esc only ever deselects: leaving the shift is MENU's, which saves it */
  if (k === "Escape") { if (ui.sel) select(null); return; }
  if (k === "Tab") { e.preventDefault(); cycle(e.shiftKey ? -1 : 1); return; }
  if (replay || !a) return;
  /* the hints follow the hand on the keys */
  const l = KEY_LAYOUT[e.code];
  if (l && l !== prefs.layout) { prefs.layout = l; save(KEY_PREFS, prefs); renderPanel(); if (ui.coach === 2) coach(2); }
  const p = ui.sel && find(S, ui.sel);
  if (!p) return;
  e.preventDefault();
  if (a === "hdgL") { ui.h = (ui.h + 7) % 8; renderPanel(); }
  else if (a === "hdgR") { ui.h = (ui.h + 1) % 8; renderPanel(); }
  else if (a === "altUp") { ui.alt = Math.min(5, ui.alt + 1); renderPanel(); }
  else if (a === "altDown") { ui.alt = Math.max(p.mode === "ground" ? 1 : 0, ui.alt - 1); renderPanel(); }
  else act(a);
});
document.addEventListener("keyup", e => { if (KEYS[e.code] === "fast") { loop.fast = false; if (S && loop.running) e.preventDefault(); } });
/* Tab: the next plane down the board that can take a command; Shift-Tab, up */
function cycle(dir) {
  const list = S.planes.filter(p => p.mode !== "pending");
  if (!list.length) return;
  const i = list.findIndex(p => p.id === ui.sel);
  select(list[(i + dir + list.length) % list.length].id);
}
window.addEventListener("blur", () => { loop.fast = false; });
document.addEventListener("visibilitychange", () => { if (document.hidden && loop.running && !replay) { loop.paused = true; } });
function togglePause() { if (!S || S.over) return; loop.paused = !loop.paused; $("btn-pause").setAttribute("aria-pressed", loop.paused ? "true" : "false"); }
/* a button pressed with the mouse gives the focus back, so Enter still
   sends and Space still runs the clock, one hand on the mouse and the other
   on the keys; pressed from the keyboard it keeps it, and Tab walks on */
document.addEventListener("click", e => { const b = e.target.closest("#hud button, #panel button, #scope-wrap button"); if (b && e.detail > 0) b.blur(); });
$("btn-help").addEventListener("click", () => showHelp());
$("btn-menu").addEventListener("click", () => toTitle());
$("btn-pause").addEventListener("click", togglePause);
$("btn-aids").addEventListener("click", toggleAids);
/* fast time while the button is held, as Space is */
const fastBtn = $("btn-fast");
const fastOff = () => { loop.fast = false; fastBtn.classList.remove("on"); };
fastBtn.addEventListener("pointerdown", e => { e.preventDefault(); loop.fast = true; fastBtn.classList.add("on"); });
for (const ev of ["pointerup", "pointercancel", "pointerleave"]) fastBtn.addEventListener(ev, fastOff);
fastBtn.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); loop.fast = true; fastBtn.classList.add("on"); } });
fastBtn.addEventListener("keyup", fastOff);

/* ---- the title's scene: a scope, sweeping ---- */
function sceneSVG() {
  let seed = 9;
  const r = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  let o = `<svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice"><defs>
    <radialGradient id="pa-glow" cx="600" cy="400" r="420" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#54f2ff" stop-opacity=".05"/><stop offset="1" stop-color="#54f2ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="pa-sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#54f2ff" stop-opacity="0"/><stop offset="1" stop-color="#54f2ff" stop-opacity=".22"/></linearGradient></defs>
    <circle cx="600" cy="400" r="420" fill="url(#pa-glow)"/>`;
  for (let x = 0; x <= 1200; x += 30) for (let y = 0; y <= 800; y += 30) o += `<rect x="${x - 1}" y="${y - 1}" width="2" height="2" fill="#182438"/>`;
  for (const rad of [140, 280, 420]) o += `<circle cx="600" cy="400" r="${rad}" fill="none" stroke="#1b2540" stroke-width="1"/>`;
  o += `<line x1="600" y1="-20" x2="600" y2="820" stroke="#1b2540"/><line x1="-20" y1="400" x2="1220" y2="400" stroke="#1b2540"/>`;
  void r;
  /* the sweep turns clockwise; its glow trails behind the line, so the wedge
     sits counter-clockwise of it and is brightest at the line */
  o += `<g class="sweep"><path d="M600 400 L600 -40 A440 440 0 0 0 289 89 Z" fill="url(#pa-sweep)"/><line x1="600" y1="400" x2="600" y2="-40" stroke="#54f2ff" stroke-opacity=".5" stroke-width="2"/></g></svg>`;
  return o;
}

/* ---- the traffic drifting under the title: the game's own glyphs, flying
   straight with the odd 45-degree turn, flashing red when two get within
   three miles at the same height, as they do on the scope ---- */
const demo = { planes: [], last: 0, cv: null };
function demoStart() {
  demo.cv = $("scene-cv");
  if (demo.planes.length) return;
  for (let i = 0; i < 10; i++) demo.planes.push({
    x: Math.random() * 40, y: Math.random() * 24, h: Math.floor(Math.random() * 8), alt: 1 + Math.floor(Math.random() * 5),
    id: LETTERS[i % LETTERS.length], puma: i % 4 === 1, turnAt: 2 + Math.random() * 10, conf: false,
  });
}
function demoRender(ts) {
  const c = demo.cv; if (!c || !c.isConnected) return;
  const dt = Math.min(0.1, (ts - demo.last) / 1000); demo.last = ts;
  const w = c.clientWidth, h = c.clientHeight;
  if (!w || !h) return;
  const d = Math.min(2, window.devicePixelRatio || 1);
  if (c.width !== Math.round(w * d) || c.height !== Math.round(h * d)) { c.width = Math.round(w * d); c.height = Math.round(h * d); }
  const g = c.getContext("2d"), pitch = Math.max(c.width / 40, c.height / 24), ox = (c.width - 40 * pitch) / 2, oy = (c.height - 24 * pitch) / 2;
  g.clearRect(0, 0, c.width, c.height);
  g.font = `${Math.max(9, pitch * .55)}px ${getComputedStyle(document.body).fontFamily}`;
  g.textBaseline = "middle"; g.textAlign = "center";
  const still = reduced();
  for (const p of demo.planes) {
    if (!still) {
      p.turnAt -= dt;
      if (p.turnAt <= 0) { p.h = (p.h + (Math.random() < .5 ? 1 : 7)) % 8; p.turnAt = 3 + Math.random() * 9; if (Math.random() < .3) p.alt = Math.max(1, Math.min(5, p.alt + (Math.random() < .5 ? 1 : -1))); }
      const v = 0.45 * dt / (Math.abs(DIRS[p.h][0]) + Math.abs(DIRS[p.h][1]) === 2 ? Math.SQRT2 : 1);
      p.x += DIRS[p.h][0] * v; p.y += DIRS[p.h][1] * v;
      if (p.x < -2) p.x = 42; if (p.x > 42) p.x = -2; if (p.y < -2) p.y = 26; if (p.y > 26) p.y = -2;
    }
    p.conf = false;
  }
  for (let i = 0; i < demo.planes.length; i++) for (let j = i + 1; j < demo.planes.length; j++) {
    const a = demo.planes[i], b = demo.planes[j];
    if (a.alt === b.alt && (a.x - b.x) ** 2 + (a.y - b.y) ** 2 < 9) a.conf = b.conf = true;
  }
  const blink = ((ts / 150) | 0) % 2 === 0;
  for (const p of demo.planes) {
    const col = p.conf && blink ? "#ff5266" : p.conf ? "#7a2a35" : p.puma ? "rgba(180,125,255,.55)" : "rgba(84,242,255,.45)";
    drawPlane(g, ox + p.x * pitch, oy + p.y * pitch, p.h, p.alt, p.id, col, pitch);
  }
}

/* ============================================================
   INIT
   ============================================================ */
function init() {
  console.log("%cPumaApproach", "color:#54f2ff;font-size:20px;font-weight:bold;font-family:monospace;");
  console.log("%cPumaApproach — greykit.com", "color:#dbe4fb;font-size:12px;font-family:monospace;");
  console.log("%cThree miles or a thousand feet. Never less.", "color:#7d8aa8;font-size:11px;font-family:monospace;");
  $("scene").innerHTML = '<canvas id="scene-cv" aria-hidden="true"></canvas>' + sceneSVG();
  demoStart();
  const boot = runBoot({ lines: [bootReloadLine(), "one file: nothing to fetch"] });
  openTitle();
  const saved = shiftSaved();
  boot.finish([saved ? `shift in progress: ${SECTORS[saved.sector].name}, ${SHIFTS[saved.shift].name}` :
    career ? `career on file: ${gsOf(career.rank)} · ${money(career.total)} earned` : "radar warm · 5 facilities on file"]).then(revealTitle);
  requestAnimationFrame(frame);
}
init();
</script>
