function konami() {
  if (!career) career = { rank: 1, total: 0, skill: 1, shifts: 0, since: Date.now() };
  const was = career.rank;
  career.rank = Math.min(MAX_RANK, career.rank + 1);
  career.unlocked = true;
  save(KEY_CAREER, career);
  if (loop.running && !replay) loop.paused = true;
  play("end");
  if (titleOpen) refreshTitle();
  alertSheet((career.rank > was ? "Promoted to " + gsOf(career.rank) + "." : gsOf(career.rank) + " is the top of the ladder.") +
    " Every facility and every shift is open to you. A shift in progress keeps the rank it started with.", "Clearance granted");
}

/* ---- keys: one hand on the mouse, the other on the keys, whichever hand
   that is. Three layouts do the same things, by physical key (e.code), so
   the numpad works with Num Lock either way. The left hand sits on WASD,
   with Z and C below it for the holds, Q above for Say and E for Send; the
   right hand on the arrows with [ ] / and Enter, or on the numpad as the
   left hand mirrored: 1 3 hold, 7 sends, 9 says, 0 runs the clock. Space
   only ever runs the clock. Esc cancels, Tab walks the board. The panel's
   hints follow the layout last used. ---- */
const LAYOUTS = {
  left:   { hdgL: "KeyA", hdgR: "KeyD", altUp: "KeyW", altDown: "KeyS", holdL: "KeyZ", holdR: "KeyC", status: "KeyQ", send: "KeyE", fast: "Space" },
  arrows: { hdgL: "ArrowLeft", hdgR: "ArrowRight", altUp: "ArrowUp", altDown: "ArrowDown", holdL: "BracketLeft", holdR: "BracketRight", status: "Slash", send: "Enter", fast: "Space" },
  numpad: { hdgL: "Numpad4", hdgR: "Numpad6", altUp: "Numpad8", altDown: "Numpad5", holdL: "Numpad1", holdR: "Numpad3", status: "Numpad9", send: "Numpad7", fast: "Numpad0" },
};
/* code → action, with a few aliases; code → the one layout it belongs to,
   null for a key two layouts share */
const KEYS = { Numpad2: "altDown", NumpadEnter: "send", Period: "fast" }, KEY_LAYOUT = { Numpad2: "numpad", NumpadEnter: "numpad" };
for (const l in LAYOUTS) for (const a in LAYOUTS[l]) {
  const c = LAYOUTS[l][a]; KEYS[c] = a;
  KEY_LAYOUT[c] = c in KEY_LAYOUT ? null : l;
}
if (!LAYOUTS[prefs.layout]) prefs.layout = "left";
const GLYPH = { Space: "Space", ArrowUp: "↑", ArrowDown: "↓", ArrowLeft: "←", ArrowRight: "→", BracketLeft: "[", BracketRight: "]", Enter: "⏎", NumpadEnter: "⏎", Slash: "/", NumpadMultiply: "*" };
const glyph = (c, long) => long && /Enter$/.test(c) ? "Enter" : GLYPH[c] || c.replace(/^Key|^Numpad/, "");
/* the key for an action in the layout last used, for the hints */
const hint = (a, long) => glyph(LAYOUTS[prefs.layout][a], long);
document.addEventListener("keydown", e => {
  if (sheet) { if (e.key === "Escape") { e.preventDefault(); closeSheet(); } else if (e.key === "Tab") trapTab(sheet.el, e); else if (sheet.onKey && !e.ctrlKey && !e.metaKey && !e.altKey) sheet.onKey(e); return; }
  if (titleOpen) { if (!e.ctrlKey && !e.metaKey && !e.altKey) titleKey(e); return; }
  if (!S || !loop.running) return;
  /* Space only ever runs the clock, whatever has the focus: a button it
     would otherwise press is Enter's */
  if (KEYS[e.code] === "fast" && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); loop.fast = true; return; }
  /* a button in the header or the panel has the focus: Tab and Enter are
     the browser's there, and walk or press the buttons */
  const onButton = e.target.closest && e.target.closest("#hud, #panel, #scope-wrap button");
  if (onButton && (e.key === "Tab" || (e.key === "Enter" && e.target.tagName === "BUTTON"))) return;
  if (e.key === "F6") { e.preventDefault(); region(e.shiftKey ? -1 : 1); return; }
  /* quick keys, the way an RTS does its groups: Ctrl (or Shift) and a digit
     on the top row puts the selected plane on that digit; the digit alone
     selects it. The numpad's digits stay controls. */
  const digit = /^Digit(\d)$/.test(e.code) ? e.code.slice(5) : null;
  if (digit && (e.ctrlKey || e.shiftKey) && !e.altKey && !e.metaKey) {
    e.preventDefault();
    if (!ui.sel || replay) return;
    for (const d in S.hot) if (S.hot[d] === ui.sel) delete S.hot[d];
    S.hot[digit] = ui.sel; play("select"); renderStrips(); renderPanel();
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (digit) { e.preventDefault(); if (S.hot[digit] && find(S, S.hot[digit])) select(S.hot[digit]); return; }
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key, a = KEYS[e.code];
  if (k === "Backspace") { e.preventDefault(); toTitle(); return; }
  if (k === "m") { toggleMute(); return; }
  if (k === "h" || k === "?") { showHelp(); return; }
  if (k === "l") { toggleAids(); return; }
  if (k === "p" || k === "Pause") { e.preventDefault(); togglePause(); return; }
  /* Esc deselects, then puts the tips away; in a replay it goes back to the
     report. Leaving the shift is MENU's, which saves it */
  if (k === "Escape") {
    if (replay && replay.from) backToReport();
    else if (ui.sel) select(null);
    else if (!$("coach").hidden) coach(COACH.length);
    return;
  }
  if (k === "Tab") { e.preventDefault(); cycle(e.shiftKey ? -1 : 1); return; }
  if (replay || !a) return;
  /* the hints follow the hand on the keys */
  const l = KEY_LAYOUT[e.code];
  if (l && l !== prefs.layout) { prefs.layout = l; save(KEY_PREFS, prefs); renderPanel(); if (ui.coach === 2) coach(2); }
  const p = ui.sel && find(S, ui.sel);
  if (!p) return;
  e.preventDefault();
  if (a === "hdgL") ui.h = (ui.h + 7) % 8;
  else if (a === "hdgR") ui.h = (ui.h + 1) % 8;
  else if (a === "altUp") ui.alt = Math.min(5, ui.alt + 1);
  else if (a === "altDown") ui.alt = Math.max(p.mode === "ground" ? 1 : 0, ui.alt - 1);
  else { act(a); return; }
  renderPanel();
  /* the setting, said once to a screen reader, from one node that stays put */
  const tip = cmdTip(p);
  $("sr-set").textContent = (ui.alt === 0 ? "land at " + SECTORS[S.sector].airports[landingAt(p)].code : "heading " + HDG[ui.h] + ", " + ui.alt + ",000") + (tip ? ". " + tip : "");
});
document.addEventListener("keyup", e => { if (KEYS[e.code] === "fast") { loop.fast = false; if (S && loop.running) e.preventDefault(); } });
/* F6 and Shift-F6: the keyboard's way between the screen's parts, the
   header's buttons, the board, the command panel, and a note over the scope */
function region(dir) {
  const parts = [
    $("hud").querySelector("button"),
    $("strip-list").querySelector(".strip.sel") || $("strip-list").querySelector('.strip[tabindex="0"]'),
    $("panel").querySelector("button:not(:disabled)"),
    !$("notice").hidden && $("notice").querySelector("button"),
    !$("coach").hidden && $("coach").querySelector("button"),
  ].filter(el => el && el.offsetParent);      /* a part a phone has put away is skipped */
  if (!parts.length) return;
  const zone = el => el && el.closest ? el.closest("#hud, #strip-list, #panel, #notice, #coach") : null, cur = zone(document.activeElement);
  const i = cur ? parts.findIndex(el => zone(el) === cur) : -1;
  parts[i < 0 ? (dir > 0 ? 0 : parts.length - 1) : (i + dir + parts.length) % parts.length].focus();
}
/* Tab: the next plane down the board that can take a command; Shift-Tab, up */
function cycle(dir) {
  const list = S.planes.filter(p => p.mode !== "pending");
  if (!list.length) return;
  const i = list.findIndex(p => p.id === ui.sel);
  select(list[(i + dir + list.length) % list.length].id);
}
window.addEventListener("blur", () => { loop.fast = false; });
document.addEventListener("visibilitychange", () => { if (document.hidden && loop.running && !replay) { loop.paused = true; } });
function togglePause() { if (!S || S.over) return; loop.paused = !loop.paused; $("btn-pause").setAttribute("aria-pressed", loop.paused ? "true" : "false"); }
/* a button pressed with the mouse gives the focus back, so Enter still
   sends and Space still runs the clock, one hand on the mouse and the other
   on the keys; pressed from the keyboard it keeps it, and Tab walks on */
document.addEventListener("click", e => { const b = e.target.closest("#hud button, #panel button, #scope-wrap button"); if (b && e.detail > 0) b.blur(); });
$("btn-help").addEventListener("click", () => showHelp());
$("btn-menu").addEventListener("click", () => toTitle());
$("btn-pause").addEventListener("click", togglePause);
$("btn-aids").addEventListener("click", toggleAids);
/* fast time while the button is held, as Space is */
const fastBtn = $("btn-fast");
const fastOff = () => { loop.fast = false; fastBtn.classList.remove("on"); };
fastBtn.addEventListener("pointerdown", e => { e.preventDefault(); loop.fast = true; fastBtn.classList.add("on"); });
for (const ev of ["pointerup", "pointercancel", "pointerleave"]) fastBtn.addEventListener(ev, fastOff);
fastBtn.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); loop.fast = true; fastBtn.classList.add("on"); } });
fastBtn.addEventListener("keyup", fastOff);

/* ---- the title's scene: a scope, sweeping ---- */
function sceneSVG() {
  let seed = 9;
  const r = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  let o = `<svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice"><defs>
    <radialGradient id="pa-glow" cx="600" cy="400" r="420" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#54f2ff" stop-opacity=".05"/><stop offset="1" stop-color="#54f2ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="pa-sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#54f2ff" stop-opacity="0"/><stop offset="1" stop-color="#54f2ff" stop-opacity=".22"/></linearGradient></defs>
    <circle cx="600" cy="400" r="420" fill="url(#pa-glow)"/>`;
  for (let x = 0; x <= 1200; x += 30) for (let y = 0; y <= 800; y += 30) o += `<rect x="${x - 1}" y="${y - 1}" width="2" height="2" fill="#182438"/>`;
  for (const rad of [140, 280, 420]) o += `<circle cx="600" cy="400" r="${rad}" fill="none" stroke="#1b2540" stroke-width="1"/>`;
  o += `<line x1="600" y1="-20" x2="600" y2="820" stroke="#1b2540"/><line x1="-20" y1="400" x2="1220" y2="400" stroke="#1b2540"/>`;
  void r;
  /* the sweep turns clockwise; its glow trails behind the line, so the wedge
     sits counter-clockwise of it and is brightest at the line */
  o += `<g class="sweep"><path d="M600 400 L600 -40 A440 440 0 0 0 289 89 Z" fill="url(#pa-sweep)"/><line x1="600" y1="400" x2="600" y2="-40" stroke="#54f2ff" stroke-opacity=".5" stroke-width="2"/></g></svg>`;
  return o;
}

/* ---- the traffic drifting under the title: the game's own glyphs, flying
   straight with the odd 45-degree turn, flashing red when two get within
   three miles at the same height, as they do on the scope ---- */
const demo = { planes: [], last: 0, cv: null };
function demoStart() {
  demo.cv = $("scene-cv");
  if (demo.planes.length) return;
  for (let i = 0; i < 10; i++) demo.planes.push({
    x: Math.random() * 40, y: Math.random() * 24, h: Math.floor(Math.random() * 8), alt: 1 + Math.floor(Math.random() * 5),
    id: LETTERS[i % LETTERS.length], puma: i % 4 === 1, turnAt: 2 + Math.random() * 10, conf: false,
  });
}
function demoRender(ts) {
  const c = demo.cv; if (!c || !c.isConnected) return;
  const dt = Math.min(0.1, (ts - demo.last) / 1000); demo.last = ts;
  const w = c.clientWidth, h = c.clientHeight;
  if (!w || !h) return;
  const d = Math.min(2, window.devicePixelRatio || 1);
  if (c.width !== Math.round(w * d) || c.height !== Math.round(h * d)) { c.width = Math.round(w * d); c.height = Math.round(h * d); }
  const g = c.getContext("2d"), pitch = Math.max(c.width / 40, c.height / 24), ox = (c.width - 40 * pitch) / 2, oy = (c.height - 24 * pitch) / 2;
  g.clearRect(0, 0, c.width, c.height);
  g.font = `${Math.max(9, pitch * .55)}px ${getComputedStyle(document.body).fontFamily}`;
  g.textBaseline = "middle"; g.textAlign = "center";
  const still = reduced();
  for (const p of demo.planes) {
    if (!still) {
      p.turnAt -= dt;
      if (p.turnAt <= 0) { p.h = (p.h + (Math.random() < .5 ? 1 : 7)) % 8; p.turnAt = 3 + Math.random() * 9; if (Math.random() < .3) p.alt = Math.max(1, Math.min(5, p.alt + (Math.random() < .5 ? 1 : -1))); }
      const v = 0.45 * dt / (Math.abs(DIRS[p.h][0]) + Math.abs(DIRS[p.h][1]) === 2 ? Math.SQRT2 : 1);
      p.x += DIRS[p.h][0] * v; p.y += DIRS[p.h][1] * v;
      if (p.x < -2) p.x = 42; if (p.x > 42) p.x = -2; if (p.y < -2) p.y = 26; if (p.y > 26) p.y = -2;
    }
    p.conf = false;
  }
  for (let i = 0; i < demo.planes.length; i++) for (let j = i + 1; j < demo.planes.length; j++) {
    const a = demo.planes[i], b = demo.planes[j];
    if (a.alt === b.alt && (a.x - b.x) ** 2 + (a.y - b.y) ** 2 < 9) a.conf = b.conf = true;
  }
  const blink = ((ts / 150) | 0) % 2 === 0;
  for (const p of demo.planes) {
    const col = p.conf && blink ? "#ff5266" : p.conf ? "#7a2a35" : p.puma ? "rgba(180,125,255,.55)" : "rgba(84,242,255,.45)";
    drawPlane(g, ox + p.x * pitch, oy + p.y * pitch, p.h, p.alt, p.id, col, pitch);
  }
}

/* ============================================================
   INIT
   ============================================================ */
function init() {
  console.log("%cPumaApproach", "color:#54f2ff;font-size:20px;font-weight:bold;font-family:monospace;");
  console.log("%cPumaApproach — greykit.com", "color:#dbe4fb;font-size:12px;font-family:monospace;");
  console.log("%cThree miles or a thousand feet. Never less.", "color:#7d8aa8;font-size:11px;font-family:monospace;");
  $("scene").innerHTML = '<canvas id="scene-cv" aria-hidden="true"></canvas>' + sceneSVG();
  demoStart();
  const boot = runBoot({ lines: [bootReloadLine(), "one file: nothing to fetch"] });
  openTitle();
  const saved = shiftSaved();
  boot.finish([saved ? `shift in progress: ${SECTORS[saved.sector].name}, ${SHIFTS[saved.shift].name}` :
    career ? `career on file: ${gsOf(career.rank)} · ${money(career.total)} earned` : "radar warm · 5 facilities on file"]).then(revealTitle);
  requestAnimationFrame(frame);
}
init();
</script>
